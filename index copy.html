    const AR_EXC_TYPE_STYLE = {
      'Timing Difference': 'bg-sunken text-muted',
      'Unapplied Payment': 'bg-warn-soft text-warn-ink',
      'Short-Pay': 'bg-bad-soft text-bad-ink',
      'No Payment Received': 'bg-bad-soft text-bad-ink',
      'GL Control Mismatch': 'bg-bad-soft text-bad-ink',

      'Suspense': 'bg-warn-soft text-warn-ink',

    // Types that are genuinely a mismatch between two records get the two-table manual matcher;

    // matcher. Double Collision gets its own dedicated panel (arCollisionPanel) since its ambiguity

    const AR_EXC_MATCHABLE = ['Short-Pay', 'Unapplied Payment', 'No Payment Received', 'Suspense', 'Scoped Exception'];
    // Single source of truth for how a matched invoice got settled — checked by the Matched tab,
    // the Finish summary, and Reports alike, so all three agree on 1-to-1 / Many-to-One / One-to-Many.
    function arMatchTypeFor(rec, res, invId) {
      const manual = (rec.arManualMatches || []).find(g => g.invoiceIds.includes(invId));
      if (manual) {
        if (manual.invoiceIds.length > 1 && manual.paymentIds.length > 1) return 'Many-to-Many (Manual)';

        if (manual.paymentIds.length > 1) return 'Many-to-One (Manual)';

      }

      return '1-to-1';
    }
    function arReconExceptions(rec, res) {
      const f = (DB.ui && DB.ui.arExcFilter) || { q: '', type: 'all', sort: 'amount-desc' };

      let rows = res.exceptions.filter(e => {
        if (f.type !== 'all' && e.type !== f.type) return false;
        if (f.q) {
          const q = f.q.toLowerCase();
          if (![e.description, e.customer, e.relatedId, e.id].some(v => (v || '').toLowerCase().includes(q))) return false;
        }
        return true;
      });
      const [sortKey, sortDir] = f.sort.split('-');
      rows = rows.slice().sort((a, b) => {
        const av = sortKey === 'amount' ? a.amount : sortKey === 'confidence' ? a.confidence : sortKey === 'customer' ? (a.customer || '') : a.date;
        const bv = sortKey === 'amount' ? b.amount : sortKey === 'confidence' ? b.confidence : sortKey === 'customer' ? (b.customer || '') : b.date;
        const c = av < bv ? -1 : av > bv ? 1 : 0;
        return sortDir === 'asc' ? c : -c;
      });
      const openCount = res.exceptions.filter(e => e.status === 'Open').length;
      return `<div class="p-6 fade-in">
      <div class="flex items-center gap-2 mb-4 flex-wrap">

        <select data-ar-exc-type class="field w-[210px]"><option value="all" ${f.type === 'all' ? 'selected' : ''}>All types (${res.exceptions.length})</option>${types.map(t => `<option value="${esc(t)}" ${f.type === t ? 'selected' : ''}>${esc(t)} (${res.exceptions.filter(e => e.type === t).length})</option>`).join('')}</select>

          <option value="date-desc" ${f.sort === 'date-desc' ? 'selected' : ''}>Date: newest first</option>
          <option value="date-asc" ${f.sort === 'date-asc' ? 'selected' : ''}>Date: oldest first</option>
          <option value="confidence-desc" ${f.sort === 'confidence-desc' ? 'selected' : ''}>Confidence: high → low</option>
          <option value="confidence-asc" ${f.sort === 'confidence-asc' ? 'selected' : ''}>Confidence: low → high</option>
          <option value="customer-asc" ${f.sort === 'customer-asc' ? 'selected' : ''}>Customer: A → Z</option>

      </div>

        <div class="px-4 h-11 flex items-center border-b border-line"><div class="font-semibold text-[13px]">Exception &amp; action inbox</div><div class="ml-auto text-[11.5px] text-muted">${rows.length} shown · ${openCount} open · click a row to resolve</div></div>
        <table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line"><th class="px-4 py-2">Type</th><th class="px-3 py-2">Customer</th><th class="px-3 py-2">Description</th><th class="px-3 py-2">Date</th><th class="px-3 py-2 text-right">Confidence</th><th class="px-3 py-2 text-right">Amount</th><th class="px-4 py-2 text-right">Status</th></tr></thead><tbody>
        ${rows.length ? rows.map(e => `<tr class="border-b border-line-soft last:border-0 row-hover cursor-pointer ${(DB.ui && DB.ui.arActiveException === e.key) ? 'bg-accent-soft/50' : ''}" data-act="ar-open-exception" data-id="${rec.id}" data-key="${esc(e.key)}">
          <td class="px-4 py-2.5">${arExcTypeBadge(e.type)}</td>
          <td class="px-3 py-2.5 font-medium">${esc(e.customer || '—')}</td>
          <td class="px-3 py-2.5 text-ink-soft">${esc(e.description)}</td>

          <td class="px-4 py-2.5 text-right">${e.status === 'Resolved' ? statusPill('completed') : statusPill('break')}</td></tr>`).join('')
          : `<tr><td colspan="7" class="px-4 py-10 text-center text-muted">${res.exceptions.length ? 'No exceptions match your filters.' : 'No open exceptions — everything reconciled.'}</td></tr>`}
        </tbody></table>
      </div>
      ${DB.ui && DB.ui.arActiveException ? arExceptionPanel(rec, res, DB.ui.arActiveException) : ''}
      </div>`;
    }
    // Renders the resolution UI inline, in place of "Open invoices awaiting payment" — the dedicated

    function arExceptionPanel(rec, res, key) {

    // Two-table manual matcher — for Short-Pay / Unapplied Payment exceptions, where the fix is

    function arMatchPanel(rec, res, exc) {

      const invRows = res.invoices.map(inv => `<tr class="border-b border-line-soft last:border-0 hover:bg-sunken/40">

        <td class="px-3 py-2 font-medium">${esc(inv.invoiceNumber)}</td>

      const payRows = res.payments.map(p => `<tr class="border-b border-line-soft last:border-0 hover:bg-sunken/40">
        <td class="px-3 py-2 w-8"><input type="checkbox" data-ar-match-pay value="${esc(p.paymentId)}" ${p.paymentId === prePay ? 'checked' : ''}></td>
        <td class="px-3 py-2 font-medium">${esc(p.paymentId)}</td>
        <td class="px-3 py-2 text-muted">${esc(p.customerId ? custName(p.customerId) : 'Unknown payer')}</td>
        <td class="px-3 py-2 text-right mono">${fmtMoney(p.totalReceived)}</td>
        <td class="px-3 py-2 text-right mono ${p.unappliedAmount ? 'text-warn-ink' : 'text-faint'}">${p.unappliedAmount ? fmtMoney(p.unappliedAmount) : '—'}</td></tr>`).join('');
      return `<div class="card overflow-hidden">

    // Double Collision — the payment exactly matches an open invoice from more than one candidate
    // customer (Phase 1B pool + Phase 2's exact-amount check both ran, neither could pick one). The
    // fix here is "which customer," not "which invoice" — a single-choice pick, not a checkbox grid.
    function arCollisionPanel(rec, res, exc) {
      const pay = (res.payments || []).find(p => p.paymentId === exc.relatedId);
      const custName = id => ((res.customers || []).find(c => c.customerId === id) || {}).companyName || 'Unknown';
      const candidates = (pay && pay.candidatePool || []).map(cid => {
        const inv = res.invoices.find(i => i.customerId === cid && i.status !== 'Paid' && i.effectiveBalance === pay.totalReceived);
        return inv ? { cid, name: custName(cid), inv } : null;
      }).filter(Boolean);
      return `<div class="card overflow-hidden">
        <div class="px-4 h-11 flex items-center border-b border-line gap-3"><div class="flex-1"><div class="font-semibold text-[13px]">Resolve double collision</div><div class="text-[11.5px] text-muted">${esc(exc.description)}</div></div>${arExcTypeBadge(exc.type)}<button data-act="ar-close-exception" class="text-faint hover:text-ink p-1">${icon('x', 'w-4 h-4')}</button></div>
        <div class="p-4">
        <div class="text-[11.5px] text-muted mb-3">${pay ? fmtMoney(pay.totalReceived) : ''} exactly matches an open invoice from more than one candidate customer — pick the correct one instead of guessing.</div>
        <div class="space-y-2 mb-4">${candidates.length ? candidates.map((c, i) => `<label class="flex items-center gap-3 p-3 border border-line rounded-lg cursor-pointer hover:bg-sunken/40">

          <input type="hidden" data-ar-collision-inv="${esc(c.cid)}" value="${esc(c.inv.invoiceId)}"></label>`).join('') : `<div class="text-center text-muted py-6">Candidate customers no longer have a matching open invoice — resolve from the exceptions note instead.</div>`}</div>
        <label class="lbl block mb-1.5">Note</label>

        <div class="flex justify-end gap-2"><button data-act="ar-close-exception" class="btn btn-ghost">Cancel</button><button data-act="ar-resolve-collision" data-id="${rec.id}" data-key="${esc(exc.key)}" data-pay="${esc(exc.relatedId)}" class="btn btn-primary" ${candidates.length ? '' : 'disabled'}>${icon('check', 'w-4 h-4')}Confirm customer</button></div>
        </div>
      </div>`;
    }
    // Single-value exceptions (GL, timing, gateway) aren't "match this to that" — they just need

    function arResolveNotePanel(rec, exc) {
      return `<div class="card overflow-hidden">
        <div class="px-4 h-11 flex items-center border-b border-line gap-3"><div class="flex-1"><div class="font-semibold text-[13px]">Mark resolved</div><div class="text-[11.5px] text-muted">${esc(exc.description)}</div></div>${arExcTypeBadge(exc.type)}<button data-act="ar-close-exception" class="text-faint hover:text-ink p-1">${icon('x', 'w-4 h-4')}</button></div>
        <div class="p-4">
        <label class="lbl block mb-1.5">Resolution note</label>
        <textarea id="ar-resolve-note" class="field h-20 resize-none mb-4" placeholder="What was done to resolve this?">${esc(exc.resolutionNotes || '')}</textarea>
        <div class="flex justify-end gap-2"><button data-act="ar-close-exception" class="btn btn-ghost">Cancel</button><button data-act="ar-save-resolution" data-id="${rec.id}" data-key="${esc(exc.key)}" class="btn btn-primary">${icon('check', 'w-4 h-4')}Mark resolved</button></div>
        </div>
      </div>`;
    }
    // Read-only post-completion summary — shown once "Finish Reconciliation" is clicked (and
    // reopenable afterwards from the "Reconciliation finished" badge). Every figure is derived
    // live from rec/res, nothing here is separately stored or editable.
    // Canonical, deterministic snapshot of a run's outcome — hashed via Web Crypto at sign-off time
    // (see the async 'ar-finish-recon' handler) for a real tamper-evident integrity check, not a
    // cosmetic RUN-<date>-<id> string. Async, so it's computed once and stored on rec.arFinished.hash
    // rather than inside arFinishSummaryModal, which must stay a synchronous string-returning function.
    async function computeRunHash(rec, res, finishedAt) {
      const payload = JSON.stringify({
        recId: rec.id, finishedAt, finishedBy: DB.user.name,
        invoices: res.invoices.map(i => ({ id: i.invoiceId, status: i.status, bal: i.effectiveBalance })),
        matches: res.matches.map(m => ({ inv: m.invoiceId, pay: m.paymentId, amt: m.amount })),
        overpays: res.overpays.map(m => ({ inv: m.invoiceId, pay: m.paymentId, amt: m.amount })),
        shortPays: res.shortPays.map(m => ({ inv: m.invoiceId, pay: m.paymentId, shortage: m.shortage })),
        exceptions: res.exceptions.map(e => ({ key: e.key, status: e.status, note: ((rec.arResolved || {})[e.key] || {}).note || null })),
        gl: res.glControlBalances,
      });
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payload));
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function arFinishSummaryModal(rec, res) {
      const isSignedOff = !!rec.arFinished;
      const finishedAt = rec.arFinished ? rec.arFinished.at : (rec.lastRun ? rec.lastRun.at : todayISO() + 'T' + new Date().toTimeString().slice(0, 5));
      const [fDate, fTime] = finishedAt.split('T');
      const fd = parseISO(fDate);
      const fDateLabel = `${MON[fd.getMonth()]} ${fd.getDate()}, ${fd.getFullYear()}`;
      const runHash = rec.arFinished && rec.arFinished.hash;

      // effectiveBalance (net of credit/debit notes), not raw totalAmount — keeps this exactly
      // consistent with the sub-ledger balance shown just below, by the same construction as before.
      const openingAR = res.invoices.reduce((s, i) => s + i.effectiveBalance, 0);
      const matchedVal = res.matches.reduce((s, m) => s + m.amount, 0) + res.overpays.reduce((s, m) => s + m.amount, 0);
      const matchedCount = res.matches.length + res.overpays.length;
      const matchedPct = openingAR ? +(matchedVal / openingAR * 100).toFixed(1) : 0;
      const resolvedExc = res.exceptions.filter(e => e.status === 'Resolved');
      // No distinct "adjustment journal" concept exists in this data model yet — every invoice is

      // exactly equal to the sub-ledger figure below. The GL variance is a separate fact (GL vs
      // sub-ledger, not a component of AR itself) and must never be subtracted a second time here —
      // doing so previously double-counted it and could even flip the balance negative.
      const glAdjustments = 0;

        ...res.shortPays.map(m => ({ ...m, statusHtml: `<span class="text-[11.5px] font-medium text-warn-ink">Resolved (residual ${fmtMoney(m.shortage)})</span>` })),
      ].map(m => `<tr class="border-b border-line-soft last:border-0">

      // One row per bank statement row — how (or whether) Phase 1A/1B identified who it belongs to.
      const identAuditRows = res.bankStatements.map(bs => {
        const pay = (res.payments || []).find(p => p.bankTxnId === bs.bankTxnId);
        let outcome = 'Not identified', badge = 'bg-warn-soft text-warn-ink', conf = null;
        if (bs.isBankCharge) { outcome = 'Standalone charge — bypassed'; badge = 'bg-sunken text-ink-soft'; }
        else if (pay && pay.duplicateFlag) { outcome = 'Duplicate — flagged'; badge = 'bg-bad-soft text-bad-ink'; }
        else if (pay && pay.lockedBy) { outcome = pay.lockedBy.name; badge = 'bg-ok-soft text-ok-ink'; conf = pay.lockedBy.confidence; }
        else if (pay && pay.customerId) { outcome = 'Resolved via candidate pool'; badge = 'bg-ok-soft text-ok-ink'; }
        else if (pay && pay.candidatePool && pay.candidatePool.length) { outcome = `Candidate pool of ${pay.candidatePool.length} — unresolved`; }
        const idDetailLines = arIdentificationFieldCompareLines(res, pay);
        return `<tr class="border-b border-line-soft last:border-0">
        <td class="px-3 py-2 mono text-[12px] text-muted">${esc(bs.bankTxnId)}</td>
        <td class="px-3 py-2">${esc(bs.payerName)}</td>
        <td class="px-3 py-2"><span class="inline-flex items-center h-[20px] px-2 rounded text-[11px] font-semibold ${badge}">${esc(outcome)}</span>${idDetailLines.map(l => `<div class="text-[10.5px] text-faint mono mt-0.5">${esc(l)}</div>`).join('')}</td>
        <td class="px-3 py-2 text-right mono">${conf == null ? '—' : conf + '%'}</td></tr>`;
      }).join('');

      const auditRows = resolvedExc.map(e => {
        const r = (rec.arResolved || {})[e.key] || {};
        const at = r.at ? r.at.split('T') : null;
        return `<tr class="border-b border-line-soft last:border-0">
        <td class="px-3 py-2 mono text-[12px]">${esc(e.id)}</td>
        <td class="px-3 py-2">${arExcTypeBadge(e.type)}</td>
        <td class="px-3 py-2 mono text-[12px] text-muted">${esc(e.relatedId)}</td>
        <td class="px-3 py-2 text-ink-soft">${esc(r.note || '—')}</td>
        <td class="px-3 py-2 text-muted">${esc(DB.user.name)}</td>
        <td class="px-3 py-2 mono text-[12px] text-muted">${at ? fmtDate(at[0]) + ', ' + at[1] : '—'}</td></tr>`;
      }).join('');

      return `<div id="ar-finish-summary-print" class="w-[980px] max-w-full max-h-[85vh] overflow-y-auto">
        <div class="flex items-start justify-between pb-3 mb-4 border-b border-line">
          <div>
            <div class="text-[15px] font-bold flex items-center gap-2">AR Reconciliation Post-Completion Summary
              <span class="chip bg-sunken text-muted border-line">Locked &amp; secure · view only</span>
            </div>
            <div class="text-[12px] text-muted mt-0.5">Reconciliation run reference: <span class="font-medium text-ink">${esc(rec.name)}</span></div>

          ${icon(isSignedOff ? 'check' : 'clock', 'w-4 h-4')} ${isSignedOff ? `Reconciliation successfully completed on ${fDateLabel} at ${fTime}` : `Run as of ${fDateLabel} at ${fTime} — not yet signed off`}
          <span class="ml-auto chip ${isSignedOff ? 'bg-ok text-white' : 'bg-warn text-white'} border-transparent">${isSignedOff ? 'Completed & Signed Off' : 'Awaiting sign-off'}</span>
        </div>

        <div class="grid grid-cols-4 gap-3 mb-5">
          ${kpi('Total invoices processed', res.invoices.length, fmtMoney(openingAR) + ' total value')}
          ${kpi('Fully matched volume', matchedCount, `${fmtMoney(matchedVal)} · ${matchedPct}% of value`)}
          ${kpi('Exceptions resolved', `${resolvedExc.length}/${res.exceptions.length}`, res.exceptions.length === resolvedExc.length ? `100% clearance${residualCount ? ` · ${residualCount} residual open balance` : ''}` : `${res.exceptions.length - resolvedExc.length} still open`)}
          ${kpi('Final unapplied cash', fmtMoney(res.unapplied ? res.unapplied.reduce((s, u) => s + u.amount, 0) : 0), `carried forward ${fmtMoney(unappliedCarried)}`)}
        </div>

        <div class="grid grid-cols-2 gap-4 mb-5">
          <div class="card overflow-hidden">
            <div class="px-4 h-10 flex items-center border-b border-line font-semibold text-[13px]">Executive summary</div>
            <div class="p-4 text-[13px] space-y-2">
              <div class="flex justify-between"><span class="text-muted">Opening AR</span><span class="mono font-medium">${fmtMoney(openingAR)}</span></div>
              <div class="flex justify-between"><span class="text-muted">Total collections matched</span><span class="mono font-medium text-ok-ink">-${fmtMoney(matchedVal)}</span></div>
              <div class="flex justify-between"><span class="text-muted">Total adjustments</span><span class="mono font-medium">${fmtMoney(glAdjustments)}</span></div>
              <div class="flex justify-between pt-2 border-t border-line-soft"><span class="font-semibold">Final reconciled closing balance</span><span class="mono font-semibold">${fmtMoney(closingBalance)}</span></div>
            </div>
          </div>
          <div class="card overflow-hidden">
            <div class="px-4 h-10 flex items-center border-b border-line font-semibold text-[13px]">Sub-ledger vs GL control proof</div>

              <div class="flex justify-between"><span class="text-muted">AR sub-ledger</span><span class="mono font-medium">${fmtMoney(gl ? gl.subledgerBalance : 0)}</span></div>
              <div class="flex justify-between"><span class="text-muted">GL control account${gl ? ' ' + esc(gl.account) : ''}</span><span class="mono font-medium">${fmtMoney(gl ? gl.glBalance : 0)}</span></div>
              <div class="flex justify-between pt-2 border-t border-line-soft"><span class="font-semibold">Variance</span><span class="mono font-semibold ${!gl || gl.variance === 0 ? 'text-ok-ink' : 'text-bad-ink'}">${!gl || gl.variance === 0 ? 'Zero unaccounted variance' : fmtMoney(gl.variance)}</span></div>
            </div>
          </div>
        </div>

        <div class="card overflow-hidden mb-5">
          <div class="px-4 h-10 flex items-center border-b border-line font-semibold text-[13px]">Final matched pairs summary</div>
          <table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line"><th class="px-3 py-2">Match type</th><th class="px-3 py-2">Invoice</th><th class="px-3 py-2">Customer</th><th class="px-3 py-2 text-right">Amount</th><th class="px-3 py-2">Payment ref(s)</th><th class="px-3 py-2 text-right">Status</th></tr></thead>
          <tbody>${pairRows || `<tr><td colspan="6" class="px-3 py-6 text-center text-muted">No matched pairs</td></tr>`}</tbody></table>

          <tbody>${auditRows || `<tr><td colspan="6" class="px-3 py-6 text-center text-muted">No exceptions to resolve</td></tr>`}</tbody></table>

        <div class="print-hide flex justify-end gap-2 mt-4 pt-3 border-t border-line">

          <button data-act="close-modal" class="btn btn-primary">${icon('check', 'w-4 h-4')}Close</button>
        </div>
      </div>`;
    }
    // Real Excel export (was a toast-soon stub) — same downloadBlob/HTML-table-as-.xls pattern
    // Reports already uses for its own statement export (runStatementHTML/exportRunXls).
    function arExportSummaryXls(rec, res) {
      const isSignedOff = !!rec.arFinished;
      const finishedAt = rec.arFinished ? rec.arFinished.at : (rec.lastRun ? rec.lastRun.at : todayISO());
      const runHash = rec.arFinished && rec.arFinished.hash;
      const openingAR = res.invoices.reduce((s, i) => s + i.effectiveBalance, 0);
      const matchedVal = res.matches.reduce((s, m) => s + m.amount, 0) + res.overpays.reduce((s, m) => s + m.amount, 0);
      const gl = res.glControlBalances;
      const table = (title, headers, rows) => `<h3>${title}</h3><table border="1"><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${String(c == null ? '' : c).replace(/</g, '&lt;')}</td>`).join('')}</tr>`).join('')}</table>`;
      const html = `<html><head><title>${esc(rec.name)} — Summary</title></head><body>
        <h2>${esc(rec.name)} — AR Reconciliation Summary</h2>
        <p>${isSignedOff ? 'Signed off' : 'Not yet signed off'} · ${finishedAt.replace('T', ' ')} · Executed by ${esc(DB.user.name)}</p>
        ${table('Executive summary', ['Opening AR', 'Collections matched', 'Closing balance'], [[fmtMoney(openingAR), '-' + fmtMoney(matchedVal), fmtMoney(openingAR - matchedVal)]])}
        ${table('Sub-ledger vs GL control proof', ['AR sub-ledger', 'GL control', 'Variance'], [[fmtMoney(gl ? gl.subledgerBalance : 0), fmtMoney(gl ? gl.glBalance : 0), gl ? fmtMoney(gl.variance) : '0.00']])}
        ${table('Final matched pairs', ['Invoice', 'Customer', 'Amount', 'Payment ref(s)', 'Rule'], [...res.matches, ...res.overpays].map(m => [m.invoiceNum, m.customer, fmtMoney(m.amount), m.paymentId, m.ruleName || 'Manual']))}
        ${table('Resolution & exception audit register', ['Exception ID', 'Type', 'Related record', 'Resolution', 'User', 'Timestamp'], res.exceptions.filter(e => e.status === 'Resolved').map(e => { const r = (rec.arResolved || {})[e.key] || {}; return [e.id, e.type, e.relatedId, r.note || '', DB.user.name, (r.at || '').replace('T', ' ')]; }))}
        ${table('Customer identification audit', ['Bank txn', 'Payer', 'Outcome', 'Compared fields'], res.bankStatements.map(bs => { const p = (res.payments || []).find(x => x.bankTxnId === bs.bankTxnId); const outcome = bs.isBankCharge ? 'Standalone charge' : (p && p.duplicateFlag) ? 'Duplicate' : (p && p.lockedBy) ? p.lockedBy.name : (p && p.customerId) ? 'Candidate pool' : 'Not identified'; return [bs.bankTxnId, bs.payerName, outcome, arIdentificationFieldCompareLines(res, p).join('; ')]; }))}
        <p>Audit run hash (SHA-256): ${runHash || 'Computed at sign-off'}</p>
        </body></html>`;
      downloadBlob(`${rec.name.replace(/[^a-zA-Z0-9]/g, '_')}-summary.xls`, 'application/vnd.ms-excel', html);
      logAudit('Exported summary', `${rec.name} · Excel workbook`);
      toast('Excel workbook exported');
    }

    function reconOverview(rec, res) {
      const auto = res.matches.length ? Math.round(res.matched.length / res.matches.length * 100) : 0;
      return `<div class="p-6 grid grid-cols-3 gap-5">
    <div class="card p-5 flex flex-col items-center justify-center">${matchRing(res.rate, 148)}
      <div class="mt-3 text-[12px] text-muted text-center">${res.matched.length} of ${res.total} items matched</div></div>
    <div class="col-span-2 grid grid-cols-2 gap-3 content-start">
      ${kpi('Matched', res.matched.length, fmtMoney(res.matchedVal) + ' reconciled')}
      ${kpi('Suggested', res.suggested.length, 'below ' + rec.threshold + '% confidence')}
      ${kpi('Breaks', res.breaks.length, fmtMoney(res.breakVal) + ' at risk')}
      ${kpi('Auto-match', auto + '%', 'no human touch')}
    </div>
    ${twistCard(rec, res)}
    <div class="col-span-3 card overflow-hidden">
      <div class="flex items-center px-4 h-11 border-b border-line"><div class="font-semibold text-[13px]">Rule performance</div>
        <button data-act="recon-tab" data-t="rules" class="ml-auto btn btn-ghost btn-sm">Open Rules Studio ${icon('arrowr', 'w-3.5 h-3.5')}</button></div>
      <table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line">
        <th class="px-4 py-2 font-semibold">#</th><th class="px-3 py-2 font-semibold">Rule</th>
        <th class="px-3 py-2 font-semibold">Conditions</th><th class="px-3 py-2 font-semibold text-right">Confidence</th>
        <th class="px-3 py-2 font-semibold text-right">Matched</th><th class="px-3 py-2 font-semibold">Status</th></tr></thead><tbody>
        ${res.perRule.map(({ rule, count }) => `<tr class="border-b border-line-soft">
          <td class="px-4 py-2.5 mono text-faint">${rule.priority}</td>
          <td class="px-3 py-2.5 font-medium">${esc(rule.name)}</td>
          <td class="px-3 py-2.5">${condChips(rule.cond)}</td>
          <td class="px-3 py-2.5 text-right">${confBar(rule.confidence)}</td>
          <td class="px-3 py-2.5 text-right mono font-semibold">${count}</td>
          <td class="px-3 py-2.5">${rule.enabled ? '<span class="text-ok-ink text-[12px] font-medium">● Active</span>' : '<span class="text-faint text-[12px]">○ Off</span>'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
    }
    function condChips(c) {
      const out = [];
      out.push(`<span class="chip">Ref: ${c.ref === 'exact' ? 'exact' : c.ref === 'fuzzy' ? 'fuzzy' : 'ignore'}</span>`);
      out.push(`<span class="chip">Amt: ${c.amount.mode === 'exact' ? 'exact' : c.amount.mode === 'pct' ? '±' + c.amount.value + '%' : '±' + fmtMoney(c.amount.value)}</span>`);
      out.push(`<span class="chip">Date: ±${c.date.days}d</span>`);
      return `<span class="flex flex-wrap gap-1.5">${out.join('')}</span>`;
    }

    // ── HERO: Rules Studio ──
    function reconRules(rec, res) {
      const base = rec.lastRun ? rec.lastRun.rate : res.rate;
      const delta = +(res.rate - base).toFixed(1);
      const dirty = !rec.lastRun || Math.abs(delta) > 0.05 || engineChanged(rec);
      return `<div class="flex h-full">
    <div class="flex-1 min-w-0 overflow-y-auto p-6">
      <div class="flex items-center mb-4"><div><div class="font-semibold text-[14px]">Match rules</div>
        <div class="text-[12px] text-muted">Evaluated top-to-bottom. The first rule that matches a pair wins.</div></div>
        <button data-act="add-rule" data-id="${rec.id}" class="ml-auto btn btn-ghost btn-sm">${icon('plus', 'w-3.5 h-3.5')}Add rule</button></div>
      <div class="space-y-2.5">
        ${rec.rules.slice().sort((a, b) => a.priority - b.priority).map((rl, i, arr) => ruleCard(rec, rl, i, arr.length, res)).join('')}
      </div>
      <div class="mt-5 card p-4">
        <div class="flex items-center gap-3"><div class="lbl">Auto-match threshold</div>
          <div class="mono text-[13px] font-semibold text-accent-ink ml-auto">${rec.threshold}%</div></div>
        <input type="range" min="50" max="100" value="${rec.threshold}" data-thresh="${rec.id}" class="w-full mt-3">
        <div class="text-[11.5px] text-muted mt-2">Matches at or above ${rec.threshold}% confidence are auto-applied; below become <span class="text-warn-ink font-medium">suggested</span> for review.</div>
      </div>
      ${matchWaterfall(rec, res)}
    </div>
    <div class="w-[300px] flex-none border-l border-line bg-surface overflow-y-auto p-5">
      <div class="lbl mb-3">Live simulation</div>
      <div class="flex flex-col items-center">${matchRing(res.rate, 140)}</div>
      <div class="mt-3 flex items-center justify-center gap-2 text-[12.5px]">
        <span class="text-muted">vs last run</span>
        <span class="mono font-semibold ${delta > 0 ? 'text-ok-ink' : delta < 0 ? 'text-bad-ink' : 'text-faint'}">${delta > 0 ? '+' : ''}${delta}%</span></div>
      <div class="mt-5 space-y-2">
        ${simStat('Matched', res.matched.length, 'ok')}
        ${simStat('Suggested', res.suggested.length, 'warn')}
        ${simStat('Breaks', res.breaks.length, 'bad')}
        ${simStat('Value at risk', fmtMoney(res.breakVal), 'muted')}
      </div>
      <div class="mt-5 pt-4 border-t border-line">
        ${dirty ? `<button data-act="run-recon" data-id="${rec.id}" class="btn btn-primary w-full justify-center">${icon('play', 'w-4 h-4')}Apply & run</button>
          <button data-act="revert-rules" data-id="${rec.id}" class="btn btn-ghost btn-sm w-full justify-center mt-2">Discard changes</button>`
          : `<div class="text-[12px] text-muted text-center flex items-center justify-center gap-1.5">${icon('check', 'w-4 h-4 text-ok')}In sync with last run</div>`}
      </div>
      <div class="mt-5 lbl mb-2">Matched by rule</div>
      <div class="space-y-1.5">${res.perRule.filter(p => p.count).map(({ rule, count }) => `<div class="flex items-center gap-2 text-[12px]"><span class="w-1.5 h-1.5 rounded-full ${rule.enabled ? 'bg-accent' : 'bg-faint'}"></span><span class="flex-1 truncate text-ink-soft">${esc(rule.name)}</span><span class="mono text-faint">${count}</span></div>`).join('') || '<div class="text-[12px] text-faint">No matches yet</div>'}</div>
    </div></div>`;
    }
    function simStat(l, v, t) {
      const col = t === 'ok' ? 'text-ok-ink' : t === 'warn' ? 'text-warn-ink' : t === 'bad' ? 'text-bad-ink' : 'text-ink';
      return `<div class="flex items-center justify-between px-3 h-9 rounded-md bg-sunken"><span class="text-[12.5px] text-muted">${l}</span><span class="mono text-[13px] font-semibold ${col}">${v}</span></div>`;
    }
    function matchWaterfall(rec, res) {
      const total = res.total || 1;
      const manualCount = res.matches.filter(m => m.ruleId === 'manual').length;
      const stages = [];
      if (manualCount) stages.push({ label: 'Manual matches', pairs: manualCount, color: 'var(--accent)' });
      rec.rules.slice().filter(r => r.enabled).sort((a, b) => a.priority - b.priority).forEach(rl => {
        const c = (res.perRule.find(p => p.rule.id === rl.id) || {}).count || 0;
        stages.push({ label: rl.name, pairs: c, conf: rl.confidence, color: rl.confidence >= rec.threshold ? 'var(--ok)' : 'var(--warn)' });
      });
      let rem = total;
      const rows = stages.map(s => { const consumed = s.pairs * 2; const after = rem - consumed; const r = { ...s, consumed, pct: consumed / total * 100, after }; rem = after; return r; });
      const breaks = res.breaks.length;
      const segs = [...rows.map(r => `<div title="${esc(r.label)}: ${r.pairs} pairs" style="width:${r.pct.toFixed(2)}%;background:${r.color}"></div>`),
      `<div title="Unmatched: ${breaks}" style="width:${(breaks / total * 100).toFixed(2)}%;background:var(--bad-soft)"></div>`].join('');
      return `<div class="mt-5 card overflow-hidden">
    <div class="flex items-center px-4 h-11 border-b border-line"><div class="font-semibold text-[13px]">Match waterfall</div>
      <div class="ml-auto text-[11.5px] text-muted">${total} records cascade through ${stages.length} tier${stages.length === 1 ? '' : 's'}</div></div>
    <div class="p-4">
      <div class="flex h-3 rounded-full overflow-hidden bg-sunken gap-px">${segs}</div>
      <div class="mt-4">
        ${rows.map((r, i) => `<div class="flex items-center gap-3 py-2 ${i ? 'border-t border-line-soft' : ''}">
          <div class="w-4 text-[11px] mono text-faint">${i + 1}</div>
          <span class="w-2 h-2 rounded-sm flex-none" style="background:${r.color}"></span>
          <div class="flex-1 min-w-0"><div class="text-[12.5px] font-medium truncate">${esc(r.label)}</div>
            <div class="text-[11px] text-faint">${r.conf != null ? `confidence ${r.conf} · ${r.conf >= rec.threshold ? 'auto-applied' : 'suggested'}` : 'manual confirmations'}</div></div>
          <div class="w-20 h-1.5 rounded-full bg-sunken overflow-hidden flex-none"><div class="h-full seg" style="width:${(r.after / total * 100).toFixed(1)}%;background:var(--faint)"></div></div>
          <div class="text-right w-24 flex-none"><div class="mono text-[12.5px] font-semibold">${r.pairs ? '+' + r.pairs : '0'} <span class="text-faint font-normal">pairs</span></div>
            <div class="text-[11px] text-faint mono">${r.after} left</div></div></div>`).join('')}
        <div class="flex items-center gap-3 py-2 border-t border-line">
          <div class="w-4"></div><span class="w-2 h-2 rounded-sm flex-none" style="background:var(--bad)"></span>
          <div class="flex-1"><div class="text-[12.5px] font-semibold text-bad-ink">Unmatched → breaks</div><div class="text-[11px] text-faint">need manual resolution</div></div>
          <div class="w-20 flex-none"></div>
          <div class="text-right w-24 flex-none mono text-[13px] font-semibold text-bad-ink">${breaks}</div></div>
      </div></div></div>`;
    }
    function ruleCard(rec, rl, i, total, res) {
      const editing = DB.ui.editRule === rl.id;
      const count = (res.perRule.find(p => p.rule.id === rl.id) || {}).count || 0;
      return `<div class="card ${rl.enabled ? '' : 'opacity-60'} ${editing ? 'ring-1 ring-accent' : ''}">
    <div class="flex items-center gap-3 px-3.5 py-3">
      <div class="flex flex-col text-faint">
        <button data-act="rule-up" data-id="${rec.id}" data-rule="${rl.id}" class="hover:text-ink ${i === 0 ? 'invisible' : ''}">${icon('up', 'w-3.5 h-3.5')}</button>
        <button data-act="rule-down" data-id="${rec.id}" data-rule="${rl.id}" class="hover:text-ink ${i === total - 1 ? 'invisible' : ''}">${icon('down', 'w-3.5 h-3.5')}</button></div>
      <div class="mono text-[12px] text-faint w-4">${rl.priority}</div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[13px] flex items-center gap-2">${esc(rl.name)}${count ? `<span class="text-[11px] font-medium text-muted mono">· ${count} matched</span>` : ''}</div>
        <div class="mt-1.5">${condChips(rl.cond)}</div></div>
      <div class="flex items-center gap-3">
        ${confBar(rl.confidence)}
        <button data-act="edit-rule" data-rule="${rl.id}" class="btn btn-ghost btn-sm">${editing ? 'Done' : 'Edit'}</button>
        <div class="switch" data-on="${rl.enabled}" data-act="toggle-rule" data-id="${rec.id}" data-rule="${rl.id}"></div></div>
    </div>
    ${editing ? ruleEditor(rec, rl) : ''}</div>`;
    }
    function ruleEditor(rec, rl) {
      const c = rl.cond;
      return `<div class="border-t border-line px-3.5 py-4 bg-canvas/60 grid grid-cols-4 gap-4 fade-in">
    <div><label class="lbl block mb-1.5">Rule name</label><input class="field" value="${esc(rl.name)}" data-rf="name" data-rule="${rl.id}"></div>
    <div><label class="lbl block mb-1.5">Reference</label><select class="field" data-rf="ref" data-rule="${rl.id}">
      <option value="exact" ${c.ref === 'exact' ? 'selected' : ''}>Exact match</option>
      <option value="fuzzy" ${c.ref === 'fuzzy' ? 'selected' : ''}>Fuzzy match</option>
      <option value="off" ${c.ref === 'off' ? 'selected' : ''}>Ignore</option></select></div>
    <div><label class="lbl block mb-1.5">Amount tolerance</label>
      <div class="flex gap-1.5"><select class="field" data-rf="amode" data-rule="${rl.id}" style="flex:1.2">
        <option value="exact" ${c.amount.mode === 'exact' ? 'selected' : ''}>Exact</option>
        <option value="pct" ${c.amount.mode === 'pct' ? 'selected' : ''}>Percent ±</option>
        <option value="abs" ${c.amount.mode === 'abs' ? 'selected' : ''}>Amount ±</option></select>
        <input class="field ${c.amount.mode === 'exact' ? 'opacity-40 pointer-events-none' : ''}" style="flex:1" type="number" step="0.1" value="${c.amount.mode === 'abs' ? (c.amount.value / 100) : c.amount.value}" data-rf="aval" data-rule="${rl.id}"></div></div>
    <div><label class="lbl block mb-1.5">Date window (± days)</label><input class="field" type="number" min="0" value="${c.date.days}" data-rf="date" data-rule="${rl.id}"></div>
    <div class="col-span-4 flex items-center gap-4">
      <div class="flex items-center gap-3 flex-1"><label class="lbl">Confidence</label>
        <input type="range" min="50" max="100" value="${rl.confidence}" data-rf="conf" data-rule="${rl.id}" class="flex-1 max-w-[220px]">
        <span class="mono text-[13px] font-semibold w-9">${rl.confidence}</span></div>
      <button data-act="del-rule" data-id="${rec.id}" data-rule="${rl.id}" class="btn btn-ghost btn-sm text-bad-ink">${icon('trash', 'w-3.5 h-3.5')}Delete rule</button></div></div>`;
    }
    // track whether current computed differs from last committed to show Apply state
    function engineChanged(rec) { if (!rec.lastRun) return true; const r = engine(rec); return r.rate !== rec.lastRun.rate || r.matched.length !== rec.lastRun.matched; }

    // ── Matches tab ──
    function recRow(rec, r, compact) {
      const kindCol = r.amount < 0 ? 'text-bad-ink' : 'text-ink';
      return `<div class="min-w-0"><div class="flex items-center gap-2"><span class="mono font-semibold ${kindCol} text-[13px]">${fmtMoney(r.amount, r.currency)}</span>
    <span class="text-[11px] text-faint mono">${fmtDate(r.date)}</span></div>
    <div class="text-[12px] text-ink-soft truncate">${esc(r.counterparty)} · <span class="text-muted">${esc(r.memo)}</span></div>
    ${r.reference ? `<div class="text-[11px] text-faint mono truncate">${esc(r.reference)}</div>` : ''}</div>`;
    }
    function reconMatches(rec, res) {
      const f = DB.filters.m || 'all';
      const rows = res.matches.filter(m => f === 'all' ? true : f === 'auto' ? m.confidence >= rec.threshold : m.confidence < rec.threshold);
      const A = id => rec.records.find(r => r.id === id), B = id => rec.records.find(r => r.id === id);
      const tab = (k, l, n) => `<button data-act="mfilter" data-f="${k}" class="btn btn-sm ${f === k ? 'btn-primary' : 'btn-ghost'}">${l}${n != null ? ` <span class="mono opacity-80">${n}</span>` : ''}</button>`;
      return `<div class="p-6">
    <div class="flex items-center gap-2 mb-4">${tab('all', 'All', res.matches.length)}${tab('auto', 'Auto-matched', res.matched.length)}${tab('sugg', 'Suggested', res.suggested.length)}
      <div class="ml-auto text-[12px] text-muted">${TYPE_META[rec.type].a} <span class="mono">A</span> &nbsp;↔&nbsp; <span class="mono">B</span> ${TYPE_META[rec.type].b}</div></div>
    <div class="space-y-2">
      ${rows.length ? rows.map(m => {
        const a = A(m.aId), b = B(m.bId); const sugg = m.confidence < rec.threshold;
        return `<div class="card px-4 py-3 grid items-center gap-3" style="grid-template-columns:1fr 150px 1fr auto">
          ${recRow(rec, a)}
          <div class="flex flex-col items-center gap-1">
            <div class="flex items-center gap-1.5 text-faint w-full"><span class="h-px flex-1 bg-line"></span>${icon('merge', 'w-3.5 h-3.5')}<span class="h-px flex-1 bg-line"></span></div>
            ${confBar(m.confidence)}
            <div class="text-[10.5px] text-faint truncate max-w-[140px]">${esc(m.ruleName)}</div></div>
          ${recRow(rec, b)}
          <div class="flex flex-col gap-1.5 items-end w-[120px]">${statusPill(sugg ? 'suggested' : 'matched')}
            ${sugg ? `<div class="flex gap-1"><button data-act="accept-sugg" data-id="${rec.id}" data-a="${m.aId}" data-b="${m.bId}" class="btn btn-sm btn-ghost text-ok-ink px-2">${icon('check', 'w-3.5 h-3.5')}</button>
              <button data-act="reject-sugg" data-id="${rec.id}" data-a="${m.aId}" data-b="${m.bId}" class="btn btn-sm btn-ghost text-bad-ink px-2">${icon('x', 'w-3.5 h-3.5')}</button></div>` : ''}</div>
        </div>`;
      }).join('')
          : emptyState('No matches in this view', 'Try running the reconciliation or adjusting rules.')}
    </div></div>`;
    }

    // ── Exceptions tab ──
    function breakReason(rec, r) {
      const map = {
        fee: 'Processor fee — book to expense', chargeback: 'Chargeback — investigate & book', refund: 'Refund not in ledger',
        'bank-fee': 'Bank fee — book to expense', interest: 'Interest earned — book to income',
        'in-transit': 'In transit — clears next period', outstanding: 'Outstanding — not yet cleared',
        unapplied: 'Unapplied cash on account', timing: 'Timing — posts next period',
        overdue: 'Overdue >60 days — send to collections', dispute: 'Disputed — route to disputes queue',
        unpaid: 'Bill approved, awaiting payment', nobill: 'Payment with no matching bill',
        tax: 'Tax withholding — book liability', reimb: 'Expense reimbursement — clear',
        shrinkage: 'Shrinkage / damage — book variance', noreceipt: 'Invoice with no goods receipt'
      };
      return map[r.kind] || (r.side === 'A' ? 'Present in source, missing in ledger' : 'Present in ledger, missing in source');
    }
    function reconExceptions(rec, res) {
      const breaks = res.breaks;
      return `<div class="p-6">
    <div class="flex items-center mb-4"><div><div class="font-semibold text-[14px]">${breaks.length} open break${breaks.length === 1 ? '' : 's'}</div>
      <div class="text-[12px] text-muted">${fmtMoney(res.breakVal)} unreconciled exposure</div></div>
      ${res.resolved.length ? `<div class="ml-auto text-[12px] text-muted">${res.resolved.length} resolved this period</div>` : ''}</div>
    ${breaks.length ? `<div class="card overflow-hidden"><table class="w-full text-[13px]"><thead>
      <tr class="lbl text-left border-b border-line"><th class="px-4 py-2 font-semibold">Source</th><th class="px-3 py-2 font-semibold">Date</th>
      <th class="px-3 py-2 font-semibold">Counterparty / memo</th><th class="px-3 py-2 font-semibold">Reference</th>
      <th class="px-3 py-2 font-semibold text-right">Amount</th><th class="px-3 py-2 font-semibold">Likely reason</th><th class="px-3 py-2 font-semibold text-right">Resolve</th></tr></thead><tbody>
      ${breaks.map(r => `<tr class="border-b border-line-soft row-hover">
        <td class="px-4 py-2.5"><span class="chip ${r.side === 'A' ? '' : 'bg-accent-soft text-accent-ink border-accent-soft'}">${r.side === 'A' ? TYPE_META[rec.type].aKind : TYPE_META[rec.type].bKind}</span></td>
        <td class="px-3 py-2.5 mono text-muted">${fmtDate(r.date)}</td>
        <td class="px-3 py-2.5"><div class="font-medium">${esc(r.counterparty)}</div><div class="text-[11px] text-faint">${esc(r.memo)}</div></td>
        <td class="px-3 py-2.5 mono text-faint text-[12px]">${esc(r.reference || '—')}</td>
        <td class="px-3 py-2.5 text-right mono font-semibold ${r.amount < 0 ? 'text-bad-ink' : ''}">${fmtMoney(r.amount, r.currency)}</td>
        <td class="px-3 py-2.5 text-[12px] text-muted"><div>${esc(breakReason(rec, r))}</div>${r.investigation ? `<div class="mt-1 text-warn-ink font-medium">Investigating · ${esc(r.investigation.owner)}</div>` : ''}</td>
        <td class="px-3 py-2.5"><div class="flex justify-end gap-1">
          <button data-act="resolve-break" data-id="${rec.id}" data-rec-item="${r.id}" data-mode="journal" class="btn btn-sm btn-ghost text-accent-ink">Journal entry</button>
          <button data-act="resolve-break" data-id="${rec.id}" data-rec-item="${r.id}" data-mode="writeoff" class="btn btn-sm btn-ghost">Write off</button>
          <button data-act="resolve-break" data-id="${rec.id}" data-rec-item="${r.id}" data-mode="investigate" class="btn btn-sm btn-ghost">${r.investigation ? 'Update case' : 'Investigate'}</button></div></td></tr>`).join('')}
    </tbody></table></div>`: emptyState('No open breaks 🎉', 'Every item is matched or resolved.')}
    ${res.resolved.length ? `<div class="mt-5"><div class="lbl mb-2">Resolved</div><div class="card divide-y divide-line-soft">

      if (!map) return normHeader(header) || header;
      const n = normHeader(header);
      if (map[n]) return map[n];
      for (const [k, v] of Object.entries(map)) { if (n.includes(k) || k.includes(n)) return v; }
      return normHeader(header) || header;
    }

    function countMatchedFields(headers, sourceType) {

        const n = normHeader(h);
        if (!n) return;
        if (map[n]) { count++; return; }
        for (const [k, v] of Object.entries(map)) {
          if (n.includes(k) || k.includes(n)) { count++; return; }
        }
      });
      return count;

    function ingestJob(file) {
      if (!file) return;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      DB.jobs = DB.jobs || [];
      const selSource = ($('#job-source-field') && $('#job-source-field').value) || (DB.ui && DB.ui.jobSource) || 'GL';
      DB.ui = DB.ui || {};
      DB.ui.jobSource = selSource;
      const sourceName = `${selSource} · ${file.name}`;
      const jobId = uid('job');

      // Update state synchronously so green box and checkmarks render IMMEDIATELY (0ms latency)
      DB.lastUploadedFile = {
        name: file.name,
        rows: 0,
        source: selSource,
        at: todayISO() + 'T' + new Date().toTimeString().slice(0, 5)
      };
      DB.lastUploadedCsvName = file.name;
      render();

      // Finishes the job once we know the real row objects (either parsed from the actual file,
      // or — for formats we can't parse client-side — a mocked fallback for that category).
      const finish = (rowObjs, headers) => {
        const matchedFieldCount = countMatchedFields(headers, selSource);
        if (matchedFieldCount === 0) {
          DB.lastUploadedFile = null;
          render();
          toast(`No fields are matched to be mapped for category "${selSource}"`, 'bad');
          return;
        }

        populateMappingsFromHeaders(headers, file.name, selSource);

        DB.pendingUpload = {
          file,
          fileName: file.name,
          selSource,
          sourceName,
          jobId,
          ext,
          rowObjs,
          headers
        };

        DB.lastJobInfo = { fileName: file.name, selSource, jobId, rowCount: rowObjs.length };
        render();
        toast(`${file.name} parsed (${selSource} · ${rowObjs.length} row${rowObjs.length === 1 ? '' : 's'}). Confirm mapping to save file.`, 'ok');
        openMappingModal(file.name, selSource);
      };

      if (ext === 'csv' || ext === 'tsv') {
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const { headers, rows } = parseCSV(String(rd.result || ''));
            if (!headers.length) throw new Error('No headers found');
            // Row keys use smartTarget() — the same canonical column names the mapping screen
            // shows as "Target field (DB column)" — so a real upload lines up with rec.arData
            // exactly the way the seeded CATEGORY_SAMPLE_DATA already does.
            const rowObjs = rows.filter(r => r.length && r.some(c => c)).map(r => {
              const o = {};
              headers.forEach((h, i) => { o[smartTarget(h, selSource)] = r[i] !== undefined ? r[i].trim() : ''; });
              return o;
            });
            if (!rowObjs.length) throw new Error('No data rows found');
            finish(rowObjs, headers);
          } catch (err) {
            console.error('CSV parse error', err);
            DB.lastUploadedFile = null;
            render();
            toast(`Could not parse ${file.name} — check it's a valid CSV with a header row`, 'bad');
          }
        };
        rd.onerror = () => { DB.lastUploadedFile = null; render(); toast('Could not read that file', 'bad'); };
        rd.readAsText(file);
      } else {
        // XLSX/OFX/QIF etc. aren't parsed client-side in this prototype — fall back to that
        // category's sample rows so the flow still completes, clearly not the real file's content.
        // const sample = CATEGORY_SAMPLE_DATA[selSource] || CATEGORY_SAMPLE_DATA['Bank Statements'];
        // const headers = CATEGORY_DEFAULT_HEADERS[selSource] || CATEGORY_DEFAULT_HEADERS['GL'];
        
        const categoryMap = { 'GL': 'gl', 'SL': 'invoices', 'Bank Statements': 'bankStatements', 'Customers': 'customers' };
        const dbKey = categoryMap[selSource];
        const sample = DB[dbKey] || [];
        const headers = CATEGORY_DEFAULT_HEADERS[selSource] || CATEGORY_DEFAULT_HEADERS['GL'];

        finish(sample.map(row => ({ ...row })), headers);
      }
    }

        const rowStr = r.rowData ? Object.values(r.rowData).join(' ') : [r.txnId, r.date, r.counterparty, r.description, r.reference, String(r.amount), r.currency].join(' ');
        return rowStr.toLowerCase().includes(q);
      });

    function dihReconciliation() {
      const rows = DB.recs.map(rc => {
        const res = getEngineResult(rc);
        return { rc, res };
      });
      const selected = rows.find(x => x.rc.id === DB.ui.dihRecId) || rows[0];

            </select>`;
      if (rc.type === 'ar-reconciliation') return dihARPreview(rc, res, picker);
      const recRow = (m, status) => {
        const a = rc.records.find(x => x.id === m.aId), b = rc.records.find(x => x.id === m.bId);

          <td class="px-3 py-2.5"><div class="font-semibold">${esc(b?.reference || b?.counterparty || 'Side B record')}</div><div class="text-[11px] text-faint">${esc(b?.date || '')} · ${esc(b?.counterparty || '')}</div></td>
          <td class="px-3 py-2.5 text-right mono">${fmtMoney(Math.abs(a?.amount || 0))}</td>
          <td class="px-3 py-2.5">${statusPill(status)}</td>
          <td class="px-3 py-2.5"><div class="text-[12px] font-medium">${esc(m.ruleName)}</div><div class="text-[11px] text-faint">Confidence ${m.confidence}%</div></td>
        </tr>`;
      };
      const unmatched = res.breaks.slice(0, 6).map(r => `<tr class="border-b border-line-soft row-hover">
        <td class="px-4 py-2.5"><div class="font-semibold">${esc(r.reference || r.counterparty || r.id)}</div><div class="text-[11px] text-faint">${r.side === 'A' ? 'Side A' : 'Side B'} · ${esc(r.date)}</div></td>
        <td class="px-3 py-2.5 text-muted">${esc(r.counterparty || r.memo || '—')}</td>
        <td class="px-3 py-2.5 text-right mono">${fmtMoney(Math.abs(r.amount))}</td>

      </tr>`).join('');

      return `<div class="p-6">
        <div class="card p-4 mb-4 flex items-center gap-4">

            <div class="lbl mb-1.5">Reconciliation</div>

          <button data-act="open-recon" data-id="${rc.id}" class="btn btn-primary">${icon('play', 'w-4 h-4')}Open reconciliation</button>
        </div>

        <div class="grid grid-cols-4 gap-3 mb-4">
          ${kpi('Auto-matched', res.matched.length, `${res.rate.toFixed(1)}% match rate`)}
          ${kpi('Suggested', res.suggested.length, 'requires review / approval')}
          ${kpi('Unmatched', res.breaks.length, fmtMoney(res.breakVal) + ' open value')}
          ${kpi('Active rules', rc.rules.filter(x => x.enabled).length, 'hierarchical rule set')}
        </div>

        <div class="card overflow-hidden mb-4">
          <div class="flex items-center px-4 h-11 border-b border-line">

            <div class="ml-auto flex gap-2">${rc.rules.map((r, i) => `<span class="chip">${i + 1}. ${esc(r.name)}</span>`).join('')}</div>

            <tbody>
              ${res.matched.slice(0, 4).map(m => recRow(m, 'matched')).join('')}

          <table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line"><th class="px-4 py-2">Record</th><th class="px-3 py-2">Counterparty / memo</th><th class="px-3 py-2 text-right">Amount</th><th class="px-3 py-2">Status</th><th></th></tr></thead><tbody>

    // ═══════════════════════════════════════ view: reports (historical archive) ═══════════════════════════════════════
    // Everything below is derived live from DB.recs / DB.audit — the app only keeps one lastRun
    // snapshot per reconciliation definition (no multi-run history table), so "archive" here means
    // the current run state of every configured reconciliation, not a growing log of past runs.
    function defaultRepFilters() { return { runQ: '', runStatus: 'all', runType: 'all', matQ: '', matType: 'all', matRun: 'all', excQ: '', excType: 'all', excStatus: 'all', audQ: '', audCat: 'all' }; }
    function reportsInit() { DB.ui.rep = DB.ui.rep || defaultRepFilters(); }
    function runIdFor(rc) { return `RUN-${rc.lastRun.at.slice(0, 10).replace(/-/g, '')}-${(rc.id || '').replace(/[^a-zA-Z0-9]/g, '').slice(-5).toUpperCase()}`; }
    function liveReportRuns() {
      return DB.recs.filter(rc => rc.lastRun).map(rc => {
        const res = getEngineResult(rc);
        const isAR = rc.type === 'ar-reconciliation';
        const volume = isAR ? res.invoices.length + res.payments.length : res.total;
        const matchedN = isAR ? res.matches.length + res.overpays.length : res.matched.length;
        const openExceptions = isAR ? res.exceptions.filter(e => e.status === 'Open').length : res.breaks.length;
        const exceptionValue = isAR ? res.exceptions.filter(e => e.status === 'Open').reduce((s, e) => s + e.amount, 0) : res.breakVal;
        const unappliedCash = isAR ? res.unapplied.reduce((s, u) => s + u.amount, 0) : 0;
        const matchedValue = isAR ? (res.matches.reduce((s, m) => s + m.amount, 0) + res.overpays.reduce((s, m) => s + m.amount, 0)) : res.matchedVal;
        const status = isAR ? (rc.arFinished ? 'Signed off' : (openExceptions === 0 ? 'Completed' : 'Under review'))
          : (res.breaks.length === 0 ? 'Completed' : 'Under review');
        return {
          runId: runIdFor(rc), recId: rc.id, date: rc.lastRun.at.slice(0, 10), type: TYPE_META[rc.type].label, volume,
          matched: matchedN, matchRate: res.rate, unappliedCash, exceptions: openExceptions, status,
          preparedBy: rc.owner, reviewedBy: isAR && rc.arFinished ? rc.arFinished.by : null,
          signedAt: isAR && rc.arFinished ? rc.arFinished.at : null, matchedValue, exceptionValue, currency: 'INR',
        };
      }).sort((a, b) => a.date < b.date ? 1 : -1);
    }
    function liveReportMatched() {
      const out = [];
      DB.recs.filter(rc => rc.lastRun).forEach(rc => {
        const res = getEngineResult(rc), runId = runIdFor(rc), isAR = rc.type === 'ar-reconciliation';
        if (isAR) {
          const matchTypeFor = invId => arMatchTypeFor(rc, res, invId);
          [...res.matches, ...res.overpays].forEach(m => out.push({
            id: uid('mt'), stream: 'bank-cash', runId, recId: rc.id, date: rc.lastRun.at.slice(0, 10),
            invoiceId: m.invoiceId, invoiceNum: m.invoiceNum, sideA: `Invoice ${m.invoiceNum}`,
            paymentId: m.paymentId, sideB: `Payment ${m.paymentId}`, customer: m.customer,
            reference: m.invoiceNum, amount: m.amount, overage: m.overage || 0,
            matchType: matchTypeFor(m.invoiceId), at: rc.lastRun.at, user: rc.owner, status: 'matched'
          }));
          (rc.arData.gatewaySettlements || []).forEach(g => out.push({
            id: uid('mt'), stream: 'gateway', runId, recId: rc.id, date: rc.lastRun.at.slice(0, 10),
            settlementId: g.settlementId, gateway: g.gateway, transactionId: g.transactionId,
            grossAmount: g.grossAmount, feeAmount: g.feeAmount, netAmount: g.netAmount,
            amount: g.netAmount, customer: g.customer || '—', reference: g.transactionId,
            matchType: 'Gateway', at: rc.lastRun.at, user: rc.owner, status: g.matched ? 'matched' : 'break'
          }));
          if (res.glControlBalances) {
            const g = res.glControlBalances;
            out.push({
              id: uid('mt'), stream: 'gl', runId, recId: rc.id, date: rc.lastRun.at.slice(0, 10),
              account: g.account, subledgerBalance: g.subledgerBalance, glBalance: g.glBalance,
              variance: g.variance, amount: g.variance, customer: 'GL Control',
              reference: g.account, matchType: 'GL Control', at: rc.lastRun.at, user: rc.owner,
              status: g.variance === 0 ? 'matched' : 'break'
            });
          }
        } else {
          res.matched.forEach(m => {
            const a = res.A.find(x => x.id === m.aId), b = res.B.find(x => x.id === m.bId);

    function reprioritize(rec) { rec.rules.slice().sort((a, b) => a.priority - b.priority).forEach((r, i) => r.priority = i + 1); }

    });
    document.addEventListener('change', e => {

    function applyRuleField(t) {
      const rec = getRec(DB.route.recId); if (!rec) return; const rl = rec.rules.find(r => r.id === t.dataset.rule); if (!rl) return;
      const f = t.dataset.rf, v = t.value;
      if (f === 'name') rl.name = v;
      else if (f === 'ref') rl.cond.ref = v;
      else if (f === 'amode') { rl.cond.amount.mode = v; if (v === 'exact') rl.cond.amount.value = 0; }
      else if (f === 'aval') { rl.cond.amount.value = rl.cond.amount.mode === 'abs' ? Math.round((+v || 0) * 100) : (+v || 0); }
      else if (f === 'date') rl.cond.date.days = clamp(+v || 0, 0, 60);
      else if (f === 'conf') rl.confidence = clamp(+v || 50, 50, 100);
      // live update: re-render but keep editor open & focus
      const active = document.activeElement; const key = active && active.dataset ? active.dataset.rf : null; const rid = active && active.dataset ? active.dataset.rule : null; const pos = active ? active.selectionStart : null;
      render();
      if (key) { const ne = document.querySelector(`[data-rf="${key}"][data-rule="${rid}"]`); if (ne) { ne.focus(); try { if (pos != null && ne.setSelectionRange) ne.setSelectionRange(pos, pos); } catch (_) { } } }
    }
    function applyARRuleField(t) {
      const rec = getRec(DB.route.recId); if (!rec) return; const rl = (rec.arRules || []).find(r => r.id === t.dataset.rule); if (!rl) return;
      const f = t.dataset.arf, v = t.value;
      if (f === 'name') rl.name = v;
      else if (f === 'kind') {
        // Switching matcher mid-edit — reset to that kind's default label/condition rather than

        rl.kind = v; const meta = arRuleKindMeta(rl.phase, v); rl.name = meta.label;

      }
      else if (f === 'ref') rl.cond.ref = v;
      else if (f === 'amode') { rl.cond.amount.mode = v; if (v === 'exact') rl.cond.amount.value = 0; }

        const isCount = arRuleKindMeta(rl.phase, rl.kind).unit === 'count';

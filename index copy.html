  <style>
    :root {
      --canvas: #F7F8FA;
      --surface: #FFFFFF;
      --sunken: #EEF0F4;
      --raised: #FFFFFF;
      --ink: #10131A;
      --ink-soft: #3A4150;
      --muted: #5B6472;
      --faint: #9AA2AF;
      --line: #E4E7EC;
      --line-soft: #EEF0F3;
      --accent: #4F46E5;
      --accent-soft: #EEF0FD;
      --accent-ink: #4338CA;
      --ok: #0E9F6E;
      --ok-soft: #E4F5EE;
      --ok-ink: #057A55;
      --warn: #D97706;
      --warn-soft: #FBF0E1;

      color: var(--ink);
    }

      -webkit-font-smoothing: antialiased;
      font-size: 13px;
      line-height: 1.5;
    }

      scrollbar-color: #CDD3DC transparent;
    }

    *::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    *::-webkit-scrollbar-thumb {
      background: #CDD3DC;
      border-radius: 6px;
      border: 2px solid var(--canvas);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: #B4BCC8;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    .lbl {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--ink);
      outline: none;
      transition: border-color .12s, box-shadow .12s;
    }

    .field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    select.field {
      -webkit-appearance: none;
      appearance: none;

      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-ink);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border-color: var(--line);
    }

    .btn-ghost:hover {
      background: var(--sunken);
    }

    .btn-sm {
      height: 28px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 500;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .row-hover:hover {
      background: var(--sunken);
    }

    .seg {
      transition: width .5s cubic-bezier(.2, .7, .2, 1);
    }

    .num-anim {
      transition: color .3s;
    }

    [data-tip] {
      position: relative;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: #CDD3DC;
      transition: background .15s;
      cursor: pointer;
      flex: none;
    }

    .switch[data-on="true"] {
      background: var(--accent);
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
    }

    .switch[data-on="true"]::after {
      transform: translateX(14px);
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: var(--sunken);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      padding: 0 8px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--sunken);
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }

    .fade-in {
      animation: fi .25s ease;
    }

    @keyframes fi {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .modal-back {
      background: rgba(16, 19, 26, .38);
      backdrop-filter: blur(2px);
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #ar-finish-summary-print,
      #ar-finish-summary-print * {
        visibility: visible;
      }

      #ar-finish-summary-print {
        position: absolute;
        inset: 0;
        width: 100% !important;
        max-width: none !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 24px;
      }

      #modal .modal-back {
        position: static !important;
        background: none !important;
        backdrop-filter: none !important;
        padding: 0 !important;
        display: block !important;
      }

      #modal .card.shadow-xl {
        box-shadow: none !important;
        padding: 0 !important;
      }

      .print-hide {
        display: none !important;
      }
    }
  </style>
</head>

    // ── Bridge: pulls the latest Data Hub uploads (GL / SL / Bank Statements / Customers) into

    // "sync" step, so a fresh upload takes effect the next time this reconciliation runs.
    function parseMoneyToCents(v) {
      if (v == null || v === '') return 0;
      const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
      return isFinite(n) ? Math.round(n * 100) : 0;
    }
    function normARDate(v) {
      v = String(v || '').trim(); if (!v) return todayISO();
      if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
      const p = v.split(/[-/]/);
      if (p.length === 3) {
        if (p[0].length === 4) return `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
        const m = p[0].padStart(2, '0'), d = p[1].padStart(2, '0'), y = p[2].length === 2 ? '20' + p[2] : p[2];
        return `${y}-${m}-${d}`;

      return todayISO();
    }

    // the default (nothing uploaded yet) byte-for-byte identical to the original seeded dataset.
    function latestRealJobForCategory(category) {
      return (DB.jobs || []).find(j => (j.source || '').split(' · ')[0].trim() === category);
    }
    function stagedRowsForCategory(category) {
      const job = latestRealJobForCategory(category);
      if (!job) return [];

    function mapStagedCustomers(rows) {

    function genRecords(recId, type) {
      const g = TYPE_GEN[type] || TYPE_GEN.close; const A = [], B = []; const T = todayISO(); let n = 0;
      const push = (side, o) => { (side === 'A' ? A : B).push(Object.assign({ id: `${recId}-${side}-${++n}`, recId, side, currency: 'INR', resolution: null }, o)); };
      const mkref = () => g.refP + (10000 + Math.floor(rnd() * 89999));
      // ── clean matched pairs (bulk) ──
      const NP = 22;
      for (let i = 0; i < NP; i++) {
        const co = pick(g.cos); const amt = Math.round((5000 + rnd() * 95000) * 100); const ref = mkref();
        const d = addDays(T, -Math.floor(rnd() * 20) - 1);
        const dB = g.timing ? addDays(d, -1) : (rnd() < 0.3 ? addDays(d, -1) : d);
        push('B', { date: dB, amount: amt, reference: ref, counterparty: co, memo: pick(g.memos), kind: g.kindB });
        push('A', { date: d, amount: amt, reference: ref, counterparty: co, memo: pick(g.memos), kind: g.kindA });
      }
      // ── near-match: amount off ~0.9% (only matches once amount tolerance is loosened → suggested) ──
      const nco = pick(g.cos), namt = Math.round((25000 + rnd() * 75000) * 100), nref = mkref(), nd = addDays(T, -4);
      push('B', { date: nd, amount: namt, reference: nref, counterparty: nco, memo: pick(g.memos), kind: g.kindB });
      push('A', { date: nd, amount: Math.round(namt * 0.991), reference: nref, counterparty: nco, memo: pick(g.memos), kind: g.kindA });
      // ── wide-date, no shared reference → stays a break unless a rule widens the window ──
      const wco = pick(g.cos), wamt = Math.round((12000 + rnd() * 40000) * 100);
      push('B', { date: addDays(T, -12), amount: wamt, reference: '', counterparty: wco, memo: pick(g.memos), kind: g.kindB });
      push('A', { date: addDays(T, -8), amount: wamt, reference: mkref(), counterparty: wco, memo: pick(g.memos), kind: g.kindA });
      // ── one-sided breaks (domain specific) ──
      g.aOnly.forEach(o => push('A', {
        date: addDays(T, -Math.floor(rnd() * 8) - 1), reference: mkref(), counterparty: pick(g.cos),
        amount: (o.sign || 1) * Math.round((o.lo + rnd() * (o.hi - o.lo)) * 10000), memo: o.memo, kind: o.kind
      }));
      g.bOnly.forEach(o => push('B', {
        date: addDays(T, -Math.floor(rnd() * 6) - 1), reference: '', counterparty: pick(g.cos),
        amount: (o.sign || 1) * Math.round((o.lo + rnd() * (o.hi - o.lo)) * 10000), memo: o.memo, kind: o.kind
      }));
      return { A, B };
    }

    function buildRec(type, name, owner) {
      const recId = uid('rec');
      const { A, B } = genRecords(recId, type);
      const rules = (RULESET[type] || RULESET.close)();

        id: recId, type, name, owner, cadence: CADENCE[type] || 'Monthly', threshold: 85,
        rules, records: A.concat(B), confirmed: [], rejected: [], lastRun: null
      };
      if (type === 'ap' || type === 'inventory') rec.threeway = genThreeway();
      if (type === 'payroll') rec.tax = genTax();

    // The AR reconciliation's 6 fixed phases, matching the "identify the customer first, only then
    // look at invoices, never guess" workflow: lock the customer (1A), fall back to a candidate pool
    // if no rule locks a single customer (1B), then run the scoped invoice-allocation waterfall (2)
    // — all three phases now made of *named* rules with fixed matching logic (`kind`), not generic
    // Ref/Amount/Date conditions a user assembles from scratch. The trailing three phases are
    // unchanged single-threshold checks from before. Every phase's rule list is still
    // cascading/addable/editable/toggleable and evaluated first-match-wins in priority order —
    // rules can never be deleted, only added, reordered, edited, and enabled/disabled.
    const AR_PHASES = [
      { key: 'customer-lock', priority: 1, label: 'Customer Identification', hint: 'Locks the paying customer before any invoice is looked at — first rule to succeed wins' },
      { key: 'candidate-pool', priority: 2, label: 'Candidate Pool', hint: 'Only runs if Customer Identification fails outright — narrows to a short list instead of guessing' },
      { key: 'allocation', priority: 3, label: 'Scoped Invoice Allocation', hint: 'Matches the locked (or pooled) customer\'s own invoices only — never searches globally' },
      { key: 'short-pay', priority: 4, label: 'Invoice settlement / short-pay', hint: 'Amount tolerance below which a shortfall is not flagged as a dispute' },
      { key: 'unapplied', priority: 5, label: 'Unapplied cash', hint: 'Amount tolerance below which leftover cash is not flagged' },

        { kind: 'exact-amount', label: 'Exact amount match', usesCond: false, fieldsConfigurable: true },

    // normalized; 'contains' allows the bank-side field to merely include it — real bank reference
    // fields often wrap the UTR in extra bank-specific text (e.g. "NEFT/UTR-ADV-2299/ACME").
    function matchExpectedUTR(bank, cust, rule) {
      const custProp = arFieldOpt(AR_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const custVal = cust[custProp];
      if (!custVal) return false;
      const custNorm = normToken(custVal), bankNorm = normToken(bank[bankProp]);
      if (!bankNorm) return false;
      return ((rule && rule.matchMode) || 'exact') === 'contains' ? bankNorm.includes(custNorm) : bankNorm === custNorm;
    }
    // Both the account-number pair and the IFSC pair have an independently pickable bank-side and
    // customer-side field, same shape as expected-utr's pair.
    const AR_ACCOUNT_FIELD_OPTIONS = [{ value: 'payer_account_number', prop: 'payerAccountNumber' }, { value: 'narration', prop: 'narration' }];
    const AR_ACCOUNT_CUST_FIELD_OPTIONS = [{ value: 'default_bank_account', prop: 'defaultBankAccount' }];
    const AR_IFSC_FIELD_OPTIONS = [{ value: 'payer_ifsc', prop: 'payerIFSC' }, { value: 'narration', prop: 'narration' }];
    const AR_IFSC_CUST_FIELD_OPTIONS = [{ value: 'default_ifsc', prop: 'defaultIFSC' }];
    function matchAccountIFSC(bank, cust, rule) {
      const acctCustProp = arFieldOpt(AR_ACCOUNT_CUST_FIELD_OPTIONS, rule && rule.custAccountField).prop;
      const ifscCustProp = arFieldOpt(AR_IFSC_CUST_FIELD_OPTIONS, rule && rule.custIfscField).prop;
      const acctVal = bank[arFieldOpt(AR_ACCOUNT_FIELD_OPTIONS, rule && rule.bankAccountField).prop];
      const ifscVal = bank[arFieldOpt(AR_IFSC_FIELD_OPTIONS, rule && rule.bankIfscField).prop];
      if (!acctVal || !ifscVal || !cust[acctCustProp] || !cust[ifscCustProp]) return false;
      return normDigits(acctVal) === normDigits(cust[acctCustProp]) && normToken(ifscVal) === normToken(cust[ifscCustProp]);
    }
    function matchUPI(bank, cust, rule) {
      const custProp = arFieldOpt(AR_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const custVal = cust[custProp];
      if (!custVal) return false;
      const m = String(bank[bankProp] || '').match(/[a-zA-Z0-9.\-_]{2,}@[a-zA-Z0-9.\-_]{2,}/);
      return !!m && m[0].toLowerCase() === String(custVal).toLowerCase();
    }
    function matchCustomerCode(bank, cust, rule) {
      const custProp = arFieldOpt(AR_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const custVal = cust[custProp];
      if (!custVal) return false;
      return String(bank[bankProp] || '').toUpperCase().includes(String(custVal).toUpperCase());
    }
    // Historically checked GSTIN OR PAN in one pass; now a single configurable customer-side field
    // (defaults to gstin) — add a second rule instance with custField='pan' to cover both.
    function matchGstinPan(bank, cust, rule) {
      const custProp = arFieldOpt(AR_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const custVal = cust[custProp];
      if (!custVal) return false;
      return String(bank[bankProp] || '').toUpperCase().includes(String(custVal).toUpperCase());
    }
    // Lightweight Levenshtein-distance similarity — a deliberately simple stand-in for real fuzzy
    // name-matching (e.g. a proper NLP library), good enough to demonstrate a "≥85% similarity"
    // threshold deterministically in a prototype without an external dependency.
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n; if (!n) return m;
      const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) d[i][0] = i;
      for (let j = 0; j <= n; j++) d[0][j] = j;
      for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
        d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
      }
      return d[m][n];
    }
    // Corporate-entity suffixes are noise for identity matching, not signal — "Acme Group Pvt. Ltd."
    // and "Acme Corp" should be recognized as the same payer. Strip them before comparing.
    const CORP_SUFFIX_RE = /\b(private|pvt|limited|ltd|llp|llc|inc|incorporated|corp|corporation|co|company|group|industries|industry|enterprises|enterprise|holdings|holding|international|intl|technologies|technology|tech|solutions|solution|services|service|india|and\s+sons)\b\.?/g;
    function normalizeCompanyName(s) {
      return String(s || '').toLowerCase().replace(/[.,&'()]/g, ' ').replace(CORP_SUFFIX_RE, ' ').replace(/\s+/g, ' ').trim();
    }
    function nameSimilarityPct(a, b) {
      const na = normalizeCompanyName(a), nb = normalizeCompanyName(b);
      if (!na || !nb) return 0;
      return Math.round((1 - levenshtein(na, nb) / Math.max(na.length, nb.length)) * 100);
    }
    function matchFuzzyName(bank, cust, rule) {
      const custProp = arFieldOpt(AR_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      return nameSimilarityPct(bank[bankProp], cust[custProp]) >= ((rule && rule.confidence) || 85);
    }
    function matchAccountSuffix(bank, cust, rule) {
      const bankProp = arFieldOpt(AR_ACCOUNT_FIELD_OPTIONS, rule && rule.bankField).prop;
      const custProp = arFieldOpt(AR_ACCOUNT_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const bs = normDigits(bank[bankProp]).slice(-4), cs = normDigits(cust[custProp]).slice(-4);
      return bs.length === 4 && bs === cs;
    }
    function matchNarrationTokens(bank, cust, rule) {
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const custProp = arFieldOpt(AR_CUST_FIELD_OPTIONS, rule && rule.secondField).prop;
      const tokens = String(bank[bankProp] || '').toUpperCase().split(/[^A-Z0-9]+/).filter(t => t.length >= 3);
      const nameTokens = String(cust[custProp] || '').toUpperCase().split(/[^A-Z0-9]+/).filter(t => t.length >= 3);
      return nameTokens.some(nt => tokens.includes(nt));
    }
    const CUSTOMER_LOCK_MATCHERS = {
      'expected-utr': matchExpectedUTR, 'account-ifsc': matchAccountIFSC, 'upi': matchUPI,
      'customer-code': matchCustomerCode, 'gstin-pan': matchGstinPan, 'fuzzy-name': matchFuzzyName,
    };
    const CANDIDATE_POOL_MATCHERS = { 'account-suffix': matchAccountSuffix, 'narration-tokens': matchNarrationTokens };

    // ═══════════════════════════════════════ Phase 2 — Scoped Invoice Allocation (single-row kinds) ═══════════════════════════════════════
    // These four run against one bank row and one customer's invoice pool at a time. The remaining
    // five kinds (subset-sum, bank-fee, write-off, overpayment, partial-payment) need to mutate a
    // shared "still unclaimed" pool across multiple bank rows and invoices at once, so they're
    // orchestrated directly inside arEngine's Phase 2 loop rather than expressed as pure functions here.
    // Resolves the second-side comparison value per pool entry — when the chosen source is the
    // invoice itself the value varies per invoice; when it's the customer, every invoice in the
    // pool shares that one (single) customer value, since it doesn't vary per invoice.
    function arSecondValuesForPool(rl, pool, cust) {
      const { sourceKey, options } = arSecondSourceInfo(rl);
      const prop = arFieldOpt(options, rl.secondField).prop;
      if (sourceKey === 'customer') { const v = cust ? cust[prop] : undefined; return pool.map(inv => ({ inv, val: v })); }
      return pool.map(inv => ({ inv, val: inv[prop] }));
    }
    function matchExactInvoiceNum(bank, pool, rule, cust) {
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const bankVal = String(bank[bankProp] || '').toUpperCase();
      const entry = arSecondValuesForPool(rule, pool, cust).find(e => e.val && bankVal.includes(String(e.val).toUpperCase()));
      return entry ? { invoiceIds: [entry.inv.invoiceId], note: 'Invoice number found in narration' } : null;
    }
    function matchInvoiceSuffix(bank, pool, rule, cust) {
      const bankProp = arFieldOpt(AR_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const bankVal = String(bank[bankProp] || '').toUpperCase();
      const entry = arSecondValuesForPool(rule, pool, cust).find(e => e.val && String(e.val).length >= 4 && bankVal.includes(String(e.val).slice(-4).toUpperCase()));
      return entry ? { invoiceIds: [entry.inv.invoiceId], note: 'Invoice number suffix found in narration' } : null;
    }
    function matchExactAmount(bank, pool, rule, cust) {
      const bankProp = arFieldOpt(AR_AMOUNT_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const hits = arSecondValuesForPool(rule, pool, cust).filter(e => e.val === bank[bankProp]);
      if (hits.length === 1) return { invoiceIds: [hits[0].inv.invoiceId], note: 'Exact amount match' };
      if (hits.length > 1) return { ambiguous: true, note: 'Multiple invoices match this amount exactly' };
      return null;
    }
    function matchTDS(bank, pool, rule, cust) {
      const bankProp = arFieldOpt(AR_AMOUNT_BANK_FIELD_OPTIONS, rule && rule.bankField).prop;
      const entry = arSecondValuesForPool(rule, pool, cust).find(e => e.inv.tdsAllowedPct > 0 && Math.round(e.val * (1 - e.inv.tdsAllowedPct / 100)) === bank[bankProp]);
      return entry ? { invoiceIds: [entry.inv.invoiceId], note: `TDS deduction of ${entry.inv.tdsAllowedPct}% recognized` } : null;
    }
    const ALLOCATION_SINGLE_ROW_MATCHERS = {
      'exact-invoice-num': matchExactInvoiceNum, 'invoice-suffix': matchInvoiceSuffix,
      'exact-amount': matchExactAmount, 'tds-match': matchTDS,
    };
    // Brute-force exact-sum subset search (size 2..maxN) — per-customer pools are tiny in this
    // app, so this is cheap. Finds cases like "two NEFT transfers together equal one invoice" or
    // "one lump-sum deposit exactly covers two invoices" that no single-row matcher can see.
    function findExactSumSubset(items, target, maxN) {
      const n = items.length;
      for (let size = 2; size <= Math.min(maxN, n); size++) {
        const combo = [];
        const pick = start => {
          if (combo.length === size) return combo.reduce((s, i) => s + items[i].amount, 0) === target ? combo.slice() : null;
          for (let i = start; i < n; i++) { combo.push(i); const r = pick(i + 1); if (r) return r; combo.pop(); }
          return null;
        };
        const found = pick(0);
        if (found) return found.map(i => items[i]);
      }
      return null;
    }

    function arEngine(rec) {
      if (!rec.arData) return { invoices: [], payments: [], bankStatements: [], customers: [], matches: [], shortPays: [], overpays: [], unapplied: [], unmatchedInvoices: [], glMismatch: null, exceptions: [], perRule: [], autoGroups: [], rate: 0, matchedVal: 0, breakVal: 0, breaks: [], matched: [] };
      const ar = arDataFromUploads(rec.arData);
      // Uploaded files can reference a customer_id absent from the customers file — fall back
      // instead of crashing, since mismatched real-world CSVs are the norm, not the exception.
      const cust = id => ar.customers.find(c => c.customerId === id) || { customerId: id, companyName: id ? `Unknown (${id})` : 'Unknown customer' };
      // effectiveBalance nets credit/debit notes off the face value once, up front (Phase 2.0's
      // guardrail) — every downstream comparison (matching, short-pay, sub-ledger balance) uses
      // this, never the raw totalAmount, so a credit-noted invoice is judged by what's actually owed.
      const invoices = ar.invoices.map(i => ({ ...i, effectiveBalance: i.totalAmount - (i.creditNotes || 0) + (i.debitNotes || 0) }));
      const bankStatements = ar.bankStatements.map(b => ({ ...b }));
      const exceptions = [];
      let _exN = 0;
      // key is stable across re-renders (type+relatedId) — unlike the display id (EXC-00N, which
      // just reflects flag order) — so a saved resolution/manual match still applies next render.
      const resolvedMap = rec.arResolved || {};
      const flagException = (type, relatedId, description, amount, extra) => {
        const key = type + ':' + relatedId;
        const r = resolvedMap[key];
        exceptions.push({
          id: 'EXC-' + String(++_exN).padStart(3, '0'), key, type, relatedId, description, amount,
          status: r ? 'Resolved' : 'Open', resolutionNotes: r ? r.note : null,
          date: (extra && extra.date) || todayISO(), customer: (extra && extra.customer) || null,
          confidence: (extra && extra.confidence != null) ? extra.confidence : 80,
        });
      };

      const arRules = rec.arRules || [];
      const rulesFor = k => arRules.filter(r => r.phase === k);
      const enabledRulesFor = k => rulesFor(k).filter(r => r.enabled).sort((a, b) => a.priority - b.priority);
      // Phases 4–6 are single-record threshold checks, not pairwise matches — they use the
      // highest-priority enabled rule's Amount tolerance only (Ref/Date don't apply to a solo value).
      const firstEnabled = k => enabledRulesFor(k)[0] || null;
      const thresholdOf = (rule, base) => {
        if (!rule) return Infinity; // no enabled rule in this phase → check is off
        const c = rule.cond.amount;
        if (c.mode === 'exact') return 0;
        if (c.mode === 'pct') return Math.round((c.value / 100) * base);
        return c.value; // abs, already in cents
      };

      const lockHitCounts = {}, poolHitCounts = {}, allocHitCounts = {};
      const bump = (map, id) => { if (id) map[id] = (map[id] || 0) + 1; };

      // ── Phase 1A: Customer Identification — locks the paying customer before any invoice is
      // looked at. Rules run in priority order per bank row; the first rule (and first customer)
      // that succeeds wins. A bank inflow *is* the payment record — payments[] is built fresh here,
      // one entry per row, since who it belongs to is now this waterfall's job, not a name match.
      const lockRules = enabledRulesFor('customer-lock');
      const dupUTRs = lockRules.some(r => r.kind === 'dup-utr') ? findDuplicateUTRs(bankStatements) : new Set();
      const payments = bankStatements.map(bs => ({
        paymentId: 'PAY-' + bs.bankTxnId, bankTxnId: bs.bankTxnId, totalReceived: bs.amount, unappliedAmount: bs.amount,
        customerId: null, lockedBy: null, candidatePool: [], duplicateFlag: false,
      }));
      const payFor = bankTxnId => payments.find(p => p.bankTxnId === bankTxnId);

      bankStatements.forEach(bs => {
        if (bs.isBankCharge) return; // not a customer remittance at all — bypasses identification entirely
        const pay = payFor(bs.bankTxnId);
        if (dupUTRs.has(bs.bankTxnId)) { pay.duplicateFlag = true; bump(lockHitCounts, (lockRules.find(r => r.kind === 'dup-utr') || {}).id); return; }
        for (const rule of lockRules) {
          if (rule.kind === 'dup-utr') continue; // handled above, once, not per-customer
          const matcher = CUSTOMER_LOCK_MATCHERS[rule.kind];
          if (!matcher) continue;
          const hit = ar.customers.find(c => matcher(bs, c, rule));
          if (hit) { pay.customerId = hit.customerId; pay.lockedBy = rule; bump(lockHitCounts, rule.id); break; }
        }
      });

      // ── Phase 1B: Candidate Pool — only for rows Phase 1A couldn't lock to exactly one customer.
      // No customer is finalized here; Phase 2's exact-amount rule resolves (or fails to resolve) it.
      const poolRules = enabledRulesFor('candidate-pool');
      payments.forEach(pay => {
        if (pay.customerId || pay.duplicateFlag) return;
        const bs = bankStatements.find(b => b.bankTxnId === pay.bankTxnId);
        if (bs.isBankCharge) return;
        const candidates = new Set();
        poolRules.forEach(rule => {
          const matcher = CANDIDATE_POOL_MATCHERS[rule.kind];
          if (!matcher) return;
          ar.customers.forEach(c => { if (matcher(bs, c, rule)) { candidates.add(c.customerId); bump(poolHitCounts, rule.id); } });
        });
        pay.candidatePool = [...candidates];
      });

      // ── Phase 2: Scoped Invoice Allocation — every rule below only ever looks at the locked (or
      // pooled) customer's own invoices, never the full ledger. Manual matches (saved from the
      // Exceptions inbox) are pulled out of the pool first, same as before.
      const allocRules = enabledRulesFor('allocation');
      const manualGroups = (rec.arManualMatches || [])
        .map(g => ({ ...g, invoiceIds: (g.invoiceIds || []).filter(id => invoices.some(i => i.invoiceId === id)), paymentIds: (g.paymentIds || []).filter(id => payments.some(p => p.paymentId === id)) }))
        .filter(g => g.invoiceIds.length && g.paymentIds.length);
      const manualPayIds = new Set(manualGroups.flatMap(g => g.paymentIds));
      const manualInvIds = new Set(manualGroups.flatMap(g => g.invoiceIds));
      const claimedPayIds = new Set(manualPayIds), claimedInvIds = new Set(manualInvIds);

      const shortPayRule = firstEnabled('short-pay');
      const matches = [], shortPays = [], overpays = [], unmatchedInvoices = [];
      const matchedPayIds = new Set();
      const periodEnd = todayISO();
      const openInvoicesFor = cid => invoices.filter(inv => inv.customerId === cid && inv.issueDate <= periodEnd && !claimedInvIds.has(inv.invoiceId));

      // Pools every payment in a group, applies it across the group's invoices in order (leftover
      // after the last one becomes overpay) — shared by manual groups and every auto-detected group
      // below, all judged against effectiveBalance so credit/debit notes are already netted in.
      // g.balanceOverrides (optional, {invoiceId: amount}) lets a rule declare "this invoice counts
      // as settled at this adjusted amount, not its full effectiveBalance" — needed for TDS match,
      // bank fee, and write-off, where the payment is *deliberately* short for an explained reason
      // and must land as a clean match, not a short-pay dispute.
      function applyGroupToLedger(g) {
        if (g.auto) autoGroups.push(g); // recorded so arMatchTypeFor() can label Many-to-One/One-to-Many
        const groupInvoices = g.invoiceIds.map(id => invoices.find(i => i.invoiceId === id));
        const balanceOf = inv => (g.balanceOverrides && g.balanceOverrides[inv.invoiceId] != null) ? g.balanceOverrides[inv.invoiceId] : inv.effectiveBalance;
        const groupPayments = g.paymentIds.map(id => payments.find(p => p.paymentId === id));
        const paymentLabel = g.paymentIds.join(', ');
        groupPayments.forEach(p => { matchedPayIds.add(p.paymentId); p.unappliedAmount = 0; });
        let pool = groupPayments.reduce((s, p) => s + p.totalReceived, 0);
        const applied = groupInvoices.map(inv => { const a = Math.min(pool, balanceOf(inv)); pool -= a; return a; });
        groupInvoices.forEach((inv, idx) => {
          const isLast = idx === groupInvoices.length - 1;
          const paidAmt = applied[idx] + (isLast && pool > 0 ? pool : 0);
          const bal = balanceOf(inv);
          const custName = cust(inv.customerId).companyName;
          if (paidAmt >= bal) {
            inv.status = 'Paid';
            if (paidAmt > bal) overpays.push({ invoiceId: inv.invoiceId, invoiceNum: inv.invoiceNumber, customer: custName, amount: bal, paid: paidAmt, overage: paidAmt - bal, paymentId: paymentLabel, ruleId: g.ruleId, ruleName: g.ruleName });
            else matches.push({ invoiceId: inv.invoiceId, invoiceNum: inv.invoiceNumber, customer: custName, amount: bal, paymentId: paymentLabel, ruleId: g.ruleId, ruleName: g.ruleName, note: g.note });
          } else if (paidAmt > 0) {
            inv.status = 'Partially Settled';
            const shortage = bal - paidAmt;
            shortPays.push({ invoiceId: inv.invoiceId, invoiceNum: inv.invoiceNumber, customer: custName, amount: bal, paid: paidAmt, shortage, paymentId: paymentLabel, ruleId: g.ruleId, ruleName: g.ruleName });
            const tolerance = thresholdOf(shortPayRule, bal);
            if (shortage > tolerance) flagException('Short-Pay', inv.invoiceId, `${custName} short-paid ${inv.invoiceNumber} by ${fmtMoney(shortage)}`, shortage, { date: inv.dueDate, customer: custName, confidence: 90 });
          } else {
            unmatchedInvoices.push(inv);
          }
        });
      }

      const autoGroups = [];
      const singleRowKinds = ['exact-invoice-num', 'invoice-suffix', 'exact-amount', 'tds-match'];
      const ambiguousPayIds = new Set();
      const collisionPayIds = new Set();

      // Candidate-pool resolution: try the exact-amount rule against the *union* of every pool
      // customer's invoices. Exactly one candidate's invoice matching resolves (locks) that customer
      // retroactively; more than one is a genuine Double Collision — never guessed, always an exception.
      const exactAmountRule = allocRules.find(r => r.kind === 'exact-amount');
      if (exactAmountRule) {
        const poolSlInfo = arSecondSourceInfo(exactAmountRule);
        const poolSlProp = arFieldOpt(poolSlInfo.options, exactAmountRule.secondField).prop;
        payments.filter(p => !p.customerId && !p.duplicateFlag && p.candidatePool.length).forEach(p => {
          const hits = p.candidatePool.map(cid => ({ cid, inv: openInvoicesFor(cid).find(inv => (poolSlInfo.sourceKey === 'customer' ? cust(cid)[poolSlProp] : inv[poolSlProp]) === p.totalReceived) })).filter(x => x.inv);
          if (hits.length === 1) {
            p.customerId = hits[0].cid;
            applyGroupToLedger({ invoiceIds: [hits[0].inv.invoiceId], paymentIds: [p.paymentId], auto: true, note: 'Resolved via candidate pool + exact amount' });
            claimedPayIds.add(p.paymentId); claimedInvIds.add(hits[0].inv.invoiceId);
          } else if (hits.length > 1) {
            collisionPayIds.add(p.paymentId);
            flagException('Double Collision', p.paymentId, `${fmtMoney(p.totalReceived)} payment matches open invoices from ${hits.length} different candidate customers — never auto-resolved`, p.totalReceived, { customer: 'Ambiguous', confidence: 40 });
          }
        });
      }

      const lockedCustIds = [...new Set(payments.filter(p => p.customerId && !manualPayIds.has(p.paymentId)).map(p => p.customerId))];
      lockedCustIds.forEach(cid => {
        const custObj = cust(cid);
        // Rules 2.1–2.4 — single bank row against the customer's open pool, one rule at a time.
        allocRules.filter(r => singleRowKinds.includes(r.kind)).forEach(rule => {
          const matcher = ALLOCATION_SINGLE_ROW_MATCHERS[rule.kind];
          payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).forEach(p => {
            const pool = openInvoicesFor(cid);
            if (!pool.length) return;
            const result = matcher(bankStatements.find(b => b.bankTxnId === p.bankTxnId), pool, rule, custObj);
            if (!result) return;
            if (result.ambiguous) { ambiguousPayIds.add(p.paymentId); return; } // never guess between identical amounts
            claimedPayIds.add(p.paymentId); result.invoiceIds.forEach(id => claimedInvIds.add(id));
            bump(allocHitCounts, rule.id);
            // TDS match is deliberately short of the invoice's face effectiveBalance by the allowed
            // TDS amount — that gap must count as fully settled, not a short-pay dispute.
            const balanceOverrides = rule.kind === 'tds-match' ? { [result.invoiceIds[0]]: p.totalReceived } : null;
            applyGroupToLedger({ invoiceIds: result.invoiceIds, paymentIds: [p.paymentId], auto: true, ruleId: rule.id, ruleName: rule.name, note: result.note, balanceOverrides });
          });
        });

        // Rule 2.5 — subset sum, many-to-many. Needs the whole remaining pool at once, not one row
        // at a time: N payments summing to one invoice, then one payment summing to N invoices.
        // resolveSl: whichever entity the rule's second side points at — an invoice's own field
        // (varies per invoice) or the locked customer's field (one fixed value for the whole pool).
        const resolveSl = rule => { const info = arSecondSourceInfo(rule); const prop = arFieldOpt(info.options, rule.secondField).prop; return inv => info.sourceKey === 'customer' ? custObj[prop] : inv[prop]; };
        const subsetRule = allocRules.find(r => r.kind === 'subset-sum');
        if (subsetRule) {
          const maxN = (subsetRule.cond && subsetRule.cond.amount && subsetRule.cond.amount.value) || 3;
          const subsetSl = resolveSl(subsetRule);
          openInvoicesFor(cid).forEach(inv => {
            if (claimedInvIds.has(inv.invoiceId)) return;
            const avail = payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).map(p => ({ id: p.paymentId, amount: p.totalReceived }));
            const combo = findExactSumSubset(avail, subsetSl(inv), maxN);
            if (combo) { combo.forEach(c => claimedPayIds.add(c.id)); claimedInvIds.add(inv.invoiceId); bump(allocHitCounts, subsetRule.id); applyGroupToLedger({ invoiceIds: [inv.invoiceId], paymentIds: combo.map(c => c.id), auto: true, ruleId: subsetRule.id, ruleName: subsetRule.name }); }
          });
          payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).forEach(p => {
            const avail = openInvoicesFor(cid).map(inv => ({ id: inv.invoiceId, amount: subsetSl(inv) }));
            const combo = findExactSumSubset(avail, p.totalReceived, maxN);
            if (combo) { combo.forEach(c => claimedInvIds.add(c.id)); claimedPayIds.add(p.paymentId); bump(allocHitCounts, subsetRule.id); applyGroupToLedger({ invoiceIds: combo.map(c => c.id), paymentIds: [p.paymentId], auto: true, ruleId: subsetRule.id, ruleName: subsetRule.name }); }
          });
        }

        // Rule 2.6 — bank fee / minor variance. A remaining payment short of a remaining invoice by
        // no more than the configured tolerance (or by exactly an explicit fee) still counts as fully
        // matched — the fee is booked separately, not left looking like an unexplained shortfall.
        const feeRule = allocRules.find(r => r.kind === 'bank-fee');
        if (feeRule) {
          const tol = (feeRule.cond && feeRule.cond.amount && feeRule.cond.amount.value) || 0;
          const feeSl = resolveSl(feeRule);
          payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).forEach(p => {
            const bs = bankStatements.find(b => b.bankTxnId === p.bankTxnId);
            const hit = openInvoicesFor(cid).find(inv => { const diff = feeSl(inv) - p.totalReceived; return diff > 0 && (bs.explicitFee > 0 ? diff === bs.explicitFee : diff <= tol); });
            if (hit) { claimedPayIds.add(p.paymentId); claimedInvIds.add(hit.invoiceId); bump(allocHitCounts, feeRule.id); applyGroupToLedger({ invoiceIds: [hit.invoiceId], paymentIds: [p.paymentId], auto: true, ruleId: feeRule.id, ruleName: feeRule.name, note: bs.explicitFee ? `Bank fee of ${fmtMoney(bs.explicitFee)} booked separately` : 'Minor variance absorbed into bank charges', balanceOverrides: { [hit.invoiceId]: p.totalReceived } }); }
          });
        }

        // Rule 2.7 — small balance write-off. Same shape as the fee rule, different intent: a
        // residual too small to be worth chasing gets auto-closed instead of left open forever.
        const writeOffRule = allocRules.find(r => r.kind === 'write-off');
        if (writeOffRule) {
          const tol = (writeOffRule.cond && writeOffRule.cond.amount && writeOffRule.cond.amount.value) || 0;
          const writeOffSl = resolveSl(writeOffRule);
          payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).forEach(p => {
            const hit = openInvoicesFor(cid).find(inv => { const diff = writeOffSl(inv) - p.totalReceived; return diff > 0 && diff <= tol; });
            if (hit) { claimedPayIds.add(p.paymentId); claimedInvIds.add(hit.invoiceId); bump(allocHitCounts, writeOffRule.id); applyGroupToLedger({ invoiceIds: [hit.invoiceId], paymentIds: [p.paymentId], auto: true, ruleId: writeOffRule.id, ruleName: writeOffRule.name, note: 'Small residual balance written off', balanceOverrides: { [hit.invoiceId]: p.totalReceived } }); }
          });
        }

        // Rule 2.8 — overpayment. A remaining payment that exceeds a remaining invoice; the excess
        // routes to that customer's On Account / advance balance via applyGroupToLedger's own overpay branch.
        const overpayRule = allocRules.find(r => r.kind === 'overpayment');
        if (overpayRule) {
          const overpaySl = resolveSl(overpayRule);
          payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).forEach(p => {
            const hit = openInvoicesFor(cid).find(inv => p.totalReceived > overpaySl(inv));
            if (hit) { claimedPayIds.add(p.paymentId); claimedInvIds.add(hit.invoiceId); bump(allocHitCounts, overpayRule.id); applyGroupToLedger({ invoiceIds: [hit.invoiceId], paymentIds: [p.paymentId], auto: true, ruleId: overpayRule.id, ruleName: overpayRule.name }); }
          });
        }

        // Rule 2.9 — universal partial payment, the catch-all. Whatever's still unclaimed still gets
        // associated with the oldest-due remaining invoice for a partial settlement, rather than
        // being left orphaned with a known customer but no invoice at all.
        const partialRule = allocRules.find(r => r.kind === 'partial-payment');
        if (partialRule) {
          payments.filter(p => p.customerId === cid && !claimedPayIds.has(p.paymentId)).forEach(p => {
            const pool = openInvoicesFor(cid).slice().sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
            if (!pool.length) return;
            claimedPayIds.add(p.paymentId); claimedInvIds.add(pool[0].invoiceId); bump(allocHitCounts, partialRule.id);
            applyGroupToLedger({ invoiceIds: [pool[0].invoiceId], paymentIds: [p.paymentId], auto: true, ruleId: partialRule.id, ruleName: partialRule.name, note: 'Partial payment applied' });
          });
        }
      });
      manualGroups.forEach(g => applyGroupToLedger(g));

      // ── Exception routing — "never guess" means every gap below becomes a distinct, visible
      // exception rather than a silent drop or a coin-flip match. ──
      payments.forEach(p => {
        if (p.duplicateFlag) { flagException('Duplicate Transaction', p.paymentId, `${fmtMoney(p.totalReceived)} submitted twice under the same reference (${p.bankTxnId})`, p.totalReceived, { confidence: 100 }); return; }
        const bs = bankStatements.find(b => b.bankTxnId === p.bankTxnId);
        if (bs.isBankCharge) { flagException('Standalone Bank Charge', p.paymentId, `${fmtMoney(p.totalReceived)} ${bs.narration || 'bank charge'} — posted directly, not a customer remittance`, p.totalReceived, { confidence: 100 }); return; }
        if (ambiguousPayIds.has(p.paymentId)) { flagException('Scoped Exception', p.paymentId, `${cust(p.customerId).companyName} payment ${p.paymentId} exactly matches more than one open invoice — never auto-resolved`, p.totalReceived, { customer: cust(p.customerId).companyName, confidence: 50 }); return; }
        if (collisionPayIds.has(p.paymentId)) return; // already raised as its own Double Collision exception above
        if (!p.customerId) {
          if (p.candidatePool.length) flagException('Suspense', p.paymentId, `${fmtMoney(p.totalReceived)} payment (${bs.payerName}) has a candidate pool of ${p.candidatePool.length} customers but none resolved by exact amount`, p.totalReceived, { customer: bs.payerName, confidence: 30 });
          else flagException('Suspense', p.paymentId, `${fmtMoney(p.totalReceived)} payment from ${bs.payerName} could not be identified to any customer`, p.totalReceived, { customer: bs.payerName, confidence: 20 });
          return;
        }
        if (!claimedPayIds.has(p.paymentId)) flagException('Scoped Exception', p.paymentId, `${cust(p.customerId).companyName} identified, but ${fmtMoney(p.totalReceived)} payment ${p.paymentId} matched no open invoice`, p.totalReceived, { customer: cust(p.customerId).companyName, confidence: 55 });
      });

      // Invoices that never had a single payment attempt against them (no group, no rule candidate
      // at all) were previously invisible — they only showed up indirectly via the GL variance.
      // Flag them explicitly so they appear in the inbox like every other exception.
      const touchedInvIds = new Set([...matches, ...overpays, ...shortPays].map(m => m.invoiceId));
      invoices.forEach(inv => { if (!touchedInvIds.has(inv.invoiceId) && !unmatchedInvoices.includes(inv)) unmatchedInvoices.push(inv); });
      unmatchedInvoices.forEach(inv => {
        const custName = cust(inv.customerId).companyName;
        flagException('No Payment Received', inv.invoiceId, `${custName} invoice ${inv.invoiceNumber} (${fmtMoney(inv.effectiveBalance)}) has received no payment`, inv.effectiveBalance, { date: inv.dueDate, customer: custName, confidence: 100 });
      });

      // Final bank-statement clearing status, now that every row's fate is known.
      bankStatements.forEach(bs => {
        const p = payFor(bs.bankTxnId);
        if (bs.isBankCharge) bs.clearingStatus = 'Bank Charge';
        else if (p.duplicateFlag) bs.clearingStatus = 'Exception';
        else bs.clearingStatus = (p.customerId && matchedPayIds.has(p.paymentId)) ? 'Reconciled' : 'Exception';
      });

      // ── Unapplied cash — payments never claimed by any allocation rule, above the configured
      // threshold. (Duplicates/bank-charges/suspense/scoped-exception payments are excluded — each
      // already has its own, more specific exception above; this stays the catch-all for "we know
      // who paid, or don't, but there's leftover cash sitting unapplied.") ──
      const unappliedRule = firstEnabled('unapplied');
      const unapplied = payments
        .filter(p => !p.duplicateFlag && !claimedPayIds.has(p.paymentId) && !bankStatements.find(b => b.bankTxnId === p.bankTxnId).isBankCharge && p.unappliedAmount > thresholdOf(unappliedRule, p.totalReceived))
        .map(p => ({ paymentId: p.paymentId, amount: p.unappliedAmount, customer: p.customerId ? cust(p.customerId).companyName : 'Unknown payer', bankTxnId: p.bankTxnId }));

      // ── AR Sub-Ledger vs GL Control Total Check ── Open-invoice effective balance (net of
      // credit/debit notes, not netted against partial payments) — a short-paid invoice still
      // carries its full remaining balance on the sub-ledger until the dispute is resolved.
      const glRule = firstEnabled('gl-check');
      let glMismatch = null, glControlBalances = null;
      if (glRule) {
        const subledgerBalance = invoices.filter(i => i.status !== 'Paid').reduce((s, inv) => s + inv.effectiveBalance, 0);
        const glBalance = ar.glControlBalances.glBalance;
        const variance = glBalance - subledgerBalance;
        const tolerance = thresholdOf(glRule, glBalance);
        if (Math.abs(variance) > tolerance) {
          glMismatch = { account: ar.glControlBalances.account, subledgerBalance, glBalance, variance: Math.abs(variance) };
          flagException('GL Control Mismatch', ar.glControlBalances.account, `Sub-ledger ${fmtMoney(subledgerBalance)} vs GL ${fmtMoney(glBalance)} — unposted adjustment suspected`, glMismatch.variance, { confidence: 95 });
        }
        glControlBalances = { account: ar.glControlBalances.account, subledgerBalance, glBalance, variance: Math.abs(variance) };
      }

      // ── Payment Gateway Settlements — payout batches/fees/txn IDs vs invoice line items ──
      // No sample data ships for this stream yet; wired so real settlement rows flag correctly
      // the moment they exist (matches how the Payment Gateway Settlements tab is already built).
      (ar.gatewaySettlements || []).forEach(g => {
        if (!g.matched) flagException('Gateway Variance', g.settlementId, `${g.gateway} settlement ${g.transactionId} (${fmtMoney(g.netAmount)} net) has no matching invoice line item`, g.netAmount, { date: g.settlementDate, customer: g.customer, confidence: 75 });
      });

      // ── Metrics ──
      const breaks = [...unmatchedInvoices, ...shortPays, ...unapplied];
      if (glMismatch) breaks.push({ type: 'gl-mismatch', ...glMismatch });
      const matched = [...matches, ...overpays];
      const total = invoices.length + payments.length;
      const rate = total ? +(matched.length / total * 100).toFixed(1) : 0;
      const matchedVal = matches.reduce((s, m) => s + m.amount, 0);
      const breakVal = [...unmatchedInvoices.map(i => i.effectiveBalance), ...shortPays.map(s => s.shortage), ...unapplied.map(u => u.amount)].reduce((s, v) => s + v, 0) + (glMismatch ? glMismatch.variance : 0);

      // Live per-rule result counts, driving both the Rules Studio cards and the Overview's
      // "Rule performance" table — reflects rec.arRules, so edits/adds/deletes show up immediately.
      const countFor = rl => {
        if (rl.phase === 'customer-lock') return lockHitCounts[rl.id] || 0;
        if (rl.phase === 'candidate-pool') return poolHitCounts[rl.id] || 0;
        if (rl.phase === 'allocation') return allocHitCounts[rl.id] || 0;
        if (rl.phase === 'short-pay') return shortPayRule && shortPayRule.id === rl.id ? shortPays.length : 0;
        if (rl.phase === 'unapplied') return unappliedRule && unappliedRule.id === rl.id ? unapplied.length : 0;
        if (rl.phase === 'gl-check') return glRule && glRule.id === rl.id && glMismatch ? 1 : 0;
        return 0;
      };
      const perRule = arRules.slice().sort((a, b) => a.priority - b.priority).map(rl => ({ rule: rl, count: rl.enabled ? countFor(rl) : 0 }));

      return {
        invoices, payments, bankStatements, glControlBalances, customers: ar.customers,
        matches, shortPays, overpays, unapplied, unmatchedInvoices, glMismatch, exceptions, perRule, autoGroups,
        rate, matchedVal, breakVal, breaks, matched,
        A: invoices.map((inv, i) => ({ id: `inv-${i}`, side: 'A', amount: inv.effectiveBalance, date: inv.issueDate, reference: inv.invoiceNumber, counterparty: cust(inv.customerId).companyName, memo: `Invoice ${inv.invoiceNumber}`, kind: 'invoice' })),
        B: payments.map((p, i) => ({ id: `pay-${i}`, side: 'B', amount: p.totalReceived, date: 'N/A', reference: p.paymentId, counterparty: p.customerId ? cust(p.customerId).companyName : 'Unknown', memo: p.paymentId, kind: 'payment' }))
      };
    }

    // ═══════════════════════════════════════ small components ═══════════════════════════════════════
    function statusPill(k) {
      const m = { matched: ['ok', 'Matched'], suggested: ['warn', 'Suggested'], break: ['bad', 'Break'], resolved: ['ok', 'Resolved'], completed: ['ok', 'Completed'], writeoff: ['muted', 'Written off'], investigate: ['warn', 'Investigating'], journal: ['ok', 'Journal entry'] };
      const [t, l] = m[k] || ['muted', k];
      const bg = t === 'ok' ? 'bg-ok-soft text-ok-ink' : t === 'warn' ? 'bg-warn-soft text-warn-ink' : t === 'bad' ? 'bg-bad-soft text-bad-ink' : 'bg-sunken text-muted';
      return `<span class="inline-flex items-center gap-1 h-[20px] px-2 rounded text-[11px] font-semibold ${bg}">${l}</span>`;
    }
    function confBar(c) {
      const band = c >= 90 ? 'var(--ok)' : c >= 75 ? 'var(--accent)' : 'var(--warn)';
      const segs = [20, 40, 60, 80, 100].map(t => `<span style="width:5px;height:12px;border-radius:1px;background:${c >= t - 15 ? band : 'var(--sunken)'}"></span>`).join('');
      return `<span class="inline-flex items-center gap-2"><span class="inline-flex items-end gap-[2px]">${segs}</span><span class="mono text-[12px] text-ink-soft">${c}</span></span>`;
    }
    function matchRing(rate, size = 132) {
      const r = (size - 16) / 2, c = 2 * Math.PI * r, off = c * (1 - rate / 100);
      const col = rate >= 95 ? 'var(--ok)' : rate >= 80 ? 'var(--accent)' : 'var(--warn)';
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="block">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="10"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1),stroke .3s"/>
    <text x="50%" y="49%" text-anchor="middle" class="mono" font-size="26" font-weight="600" fill="var(--ink)">${rate.toFixed(1)}</text>
    <text x="50%" y="63%" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--faint)" letter-spacing=".08em">MATCH RATE %</text>
  </svg>`;
    }
    function closeRing(pct, size = 132) {
      const r = (size - 16) / 2, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
      const col = pct >= 100 ? 'var(--ok)' : pct >= 60 ? 'var(--accent)' : 'var(--warn)';
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="block">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="10"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1),stroke .3s"/>
    <text x="50%" y="49%" text-anchor="middle" class="mono" font-size="26" font-weight="600" fill="var(--ink)">${pct}</text>
    <text x="50%" y="63%" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--faint)" letter-spacing=".08em">% READY</text>
  </svg>`;
    }
    function spark(vals, w = 120, h = 34) {
      const mn = Math.min(...vals), mx = Math.max(...vals), rng = mx - mn || 1;
      const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 4 - ((v - mn) / rng) * (h - 8)).toFixed(1)}`);
      const up = vals[vals.length - 1] >= vals[0];
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${up ? 'var(--ok)' : 'var(--warn)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" points="${pts.join(' ')}"/></svg>`;
    }
    function typeGlyph(type, cls = 'w-4 h-4') { return icon(TYPE_META[type].icon, cls); }

    // ═══════════════════════════════════════ shell ═══════════════════════════════════════
    function navItem(active, act, data, ico, label, badge) {
      return `<button data-act="${act}" ${data || ''} class="w-full flex items-center gap-2.5 px-2.5 h-9 rounded-md text-[13px] font-medium transition ${active ? 'bg-accent-soft text-accent-ink' : 'text-ink-soft hover:bg-sunken'}">
    <span class="${active ? 'text-accent' : 'text-faint'}">${icon(ico, 'w-[17px] h-[17px]')}</span><span class="flex-1 text-left">${label}</span>
    ${badge ? `<span class="mono text-[11px] ${active ? 'text-accent-ink' : 'text-faint'}">${badge}</span>` : ''}</button>`;
    }

        ${navItem(r.name === 'reconciliation', 'goto', 'data-r="reconciliation"', 'merge', 'Reconciliation')}

      </div>

      </div>

      </div>
    </aside>
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">${inner}</main>
  </div>
  <div id="modal"></div>`;
    }
    function topbar(title, sub, actions) {
      return `<header class="h-[52px] flex-none flex items-center gap-3 px-6 border-b border-line bg-surface">
    <div class="min-w-0"><div class="font-bold text-[15px] tracking-tight truncate">${title}</div>${sub ? `<div class="text-[11.5px] text-muted -mt-0.5 truncate">${sub}</div>` : ''}</div>
    <div class="ml-auto flex items-center gap-2">${actions || ''}</div></header>`;
    }

    // ═══════════════════════════════════════ view: dashboard ═══════════════════════════════════════
    function kpi(label, value, sub) {
      return `<div class="card p-4">
    <div class="lbl">${label}</div>
    <div class="mono text-[24px] font-semibold mt-1.5 leading-none">${value}</div>
    <div class="text-[11.5px] text-muted mt-1.5">${sub || ''}</div></div>`;
    }
    function toINR(a) { return a.currency === 'USD' ? Math.round(a.balance * 83.2) : a.currency === 'EUR' ? Math.round(a.balance * 90.1) : a.currency === 'GBP' ? Math.round(a.balance * 105.3) : a.currency === 'SGD' ? Math.round(a.balance * 61.8) : a.balance; }
    function viewDashboard() {
      const all = DB.recs.map(rc => ({ rc, res: getEngineResult(rc) }));
      const totBreaks = all.reduce((s, x) => s + x.res.breaks.length, 0);
      const totVal = all.reduce((s, x) => s + x.res.breakVal, 0);
      const avgRate = +(all.reduce((s, x) => s + x.res.rate, 0) / all.length).toFixed(1);
      const ready = all.filter(x => x.res.breaks.length === 0).length;
      const closePct = +(ready / all.length * 100).toFixed(0);
      const cashAccts = DB.accounts.filter(a => a.kind !== 'gateway');
      const cashTotal = cashAccts.reduce((s, a) => s + toINR(a), 0);
      const queue = []; all.forEach(({ rc, res }) => res.breaks.forEach(r => queue.push({ rc, r })));
      queue.sort((x, y) => Math.abs(y.r.amount) - Math.abs(x.r.amount));
      const kindChip = k => ({ checking: 'Checking', savings: 'Savings', card: 'Card', gateway: 'Gateway' }[k] || k);
      const failedSyncs = DB.accounts.filter(a => a.status !== 'connected').length;
      const highValue = queue.filter(x => Math.abs(x.r.amount) >= 2000000).length;
      const inner = topbar('Dashboard', `Reconciliation control tower · ${esc(DB.period.label)}`,
        `<button data-act="new-recon" class="btn btn-primary">${icon('plus', 'w-4 h-4')}New reconciliation</button>`)
        + `<div class="flex-1 overflow-y-auto p-6 fade-in">
    <div class="grid grid-cols-4 gap-3 mb-5">
      ${kpi('Auto-match rate', avgRate + '%', `Across ${all.length} reconciliations`)}
      ${kpi('Open exceptions', totBreaks, fmtMoney(totVal) + ' unreconciled value')}
      ${kpi('High-value exceptions', highValue, highValue ? 'Requires controller attention' : 'No material exposure')}
      ${kpi('Close readiness', closePct + '%', `${ready} ready · ${failedSyncs} failed import${failedSyncs === 1 ? '' : 's'}`)}
    </div>
    <div class="grid grid-cols-3 gap-5 mb-5">
      <div class="col-span-2 card overflow-hidden">
        <div class="flex items-center px-4 h-11 border-b border-line"><div><div class="font-semibold text-[13px]">Data source health</div><div class="text-[11px] text-muted">Connection and import readiness</div></div>
          <button data-act="goto" data-r="ingestion" class="ml-auto btn btn-ghost btn-sm">Manage data ${icon('arrowr', 'w-3.5 h-3.5')}</button></div>
        <table class="w-full text-[13px]"><tbody>
          ${DB.accounts.map(a => `<tr class="border-b border-line-soft last:border-0">
            <td class="px-4 py-2.5"><div class="font-medium">${esc(a.institution)} · ${esc(a.name)}</div><div class="text-[11px] text-faint">${kindChip(a.kind)} · ${a.currency}</div></td>

    }

    // ═══════════════════════════════════════ view: reconciliation ═══════════════════════════════════════
    const RECON_TABS = [['overview', 'Overview'], ['rules', 'Rules Studio'], ['matches', 'Matches'], ['exceptions', 'Exceptions'], ['sources', 'Sources']];
    const AR_RECON_TABS = [['overview', 'Overview'], ['rules', 'Rules Studio'], ['matches', 'Matched'], ['exceptions', 'Exceptions']];
    // Overview / Matches / Exceptions / Sources only render once a reconciliation has actually

    function reconNotRun(rec, res, tabLabel) {
      const isAR = rec.type === 'ar-reconciliation';

    function viewRecon() {

      let body = '';
      const tabs = isAR ? AR_RECON_TABS : RECON_TABS;
      const exceptionsCount = hasRun ? (isAR ? res.exceptions.filter(e => e.status === 'Open').length : res.breaks.length) : 0;
      const tabLabels = { overview: 'Overview', matches: isAR ? 'Matched' : 'Matches', exceptions: 'Exceptions', sources: 'Sources' };
      if (tab === 'overview') body = hasRun ? (isAR ? arReconOverview(rec, res) : reconOverview(rec, res)) : reconNotRun(rec, res, tabLabels.overview);
      else if (tab === 'rules') body = isAR ? arReconRules(rec, res) : reconRules(rec, res);
      else if (tab === 'matches') body = hasRun ? (isAR ? arReconMatches(rec, res) : reconMatches(rec, res)) : reconNotRun(rec, res, tabLabels.matches);
      else if (tab === 'exceptions') body = hasRun ? (isAR ? arReconExceptions(rec, res) : reconExceptions(rec, res)) : reconNotRun(rec, res, tabLabels.exceptions);
      else if (tab === 'sources' && !isAR) body = hasRun ? reconSources(rec, res) : reconNotRun(rec, res, tabLabels.sources);
      const canFinish = isAR && hasRun && res.exceptions.length > 0 && exceptionsCount === 0 && !rec.arFinished;
      const finishBtn = canFinish
        ? `<button data-act="ar-finish-recon" data-id="${rec.id}" class="fixed bottom-6 right-6 z-30 btn btn-primary shadow-lg flex items-center gap-1.5">${icon('check', 'w-4 h-4')}Finish Reconciliation</button>`

      return topbar(esc(rec.name), `${meta.a} <span class="text-faint">↔</span> ${meta.b} · ${rec.cadence}`, `${lastRun}${runBtn}`)
        + `<div class="flex-none px-6 border-b border-line bg-surface flex items-center gap-1">

    // ═══════════════════════════════════════ views: work queues ═══════════════════════════════════════
    function recStatus(rc, res) {
      if (!rc.lastRun) return 'Not run yet';
      if (res.breaks.length === 0) return 'Review ready';
      if (res.rate >= 90) return 'In progress';
      return 'Needs resolution';
    }
    function viewMyWork() {
      const all = DB.recs.map(rc => ({ rc, res: getEngineResult(rc) }));
      const mine = all.filter(x => x.rc.owner === DB.user.name);
      const ordered = [...mine, ...all.filter(x => x.rc.owner !== DB.user.name)].slice(0, 6);
      const task = x => {
        const { rc, res } = x;
        if (!rc.lastRun) return `<tr class="border-b border-line-soft row-hover cursor-pointer" data-act="open-recon" data-id="${rc.id}">
    <td class="px-4 py-3"><div class="font-semibold">${esc(rc.name)}</div><div class="text-[11px] text-faint">${TYPE_META[rc.type].label} · ${rc.cadence}</div></td>
    <td class="px-3 py-3"><span class="chip">${esc(rc.owner === DB.user.name ? 'Assigned to me' : 'Waiting on ' + rc.owner.split(' ')[0])}</span></td>

    <td class="px-4 py-3 text-right text-[12px] font-medium text-muted">—</td></tr>`;
        const action = res.breaks.length ? 'Resolve exceptions' : res.rate < 95 ? 'Prepare reconciliation' : 'Review & submit'; return `<tr class="border-b border-line-soft row-hover cursor-pointer" data-act="open-recon" data-id="${rc.id}">
    <td class="px-4 py-3"><div class="font-semibold">${esc(rc.name)}</div><div class="text-[11px] text-faint">${TYPE_META[rc.type].label} · ${rc.cadence}</div></td>
    <td class="px-3 py-3"><span class="chip">${esc(rc.owner === DB.user.name ? 'Assigned to me' : 'Waiting on ' + rc.owner.split(' ')[0])}</span></td>
    <td class="px-3 py-3"><div class="font-medium ${res.breaks.length ? 'text-warn-ink' : 'text-ok-ink'}">${action}</div><div class="text-[11px] text-faint">${res.breaks.length ? res.breaks.length + ' open exception' + (res.breaks.length === 1 ? '' : 's') : res.rate.toFixed(1) + '% matched'}</div></td>

      };
      return topbar('My work', 'Tasks assigned to you and items waiting for your review', '') + `<div class="flex-1 overflow-y-auto p-6 fade-in">
    <div class="grid grid-cols-3 gap-3 mb-5">${kpi('Due today', mine.length, 'assigned to you')}${kpi('Overdue', all.filter(x => x.res.breaks.length > 3).length, 'need a resolution')}${kpi('Waiting on others', all.filter(x => x.rc.owner !== DB.user.name).length, 'preparer-owned')}</div>
    <div class="card overflow-hidden mb-5"><div class="h-12 px-4 flex items-center border-b border-line"><div><div class="font-semibold text-[13px]">Your task queue</div><div class="text-[11px] text-muted">Filter by assignment, role, or due date</div></div><div class="ml-auto flex gap-2"><button class="btn btn-ghost btn-sm">Assigned to me</button><button class="btn btn-ghost btn-sm">Due this week</button></div></div><table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line"><th class="px-4 py-2">Reconciliation</th><th class="px-3 py-2">Assignment</th><th class="px-3 py-2">Next action</th><th class="px-3 py-2">Exposure</th><th class="px-4 py-2 text-right">Due</th></tr></thead><tbody>${ordered.map(task).join('')}</tbody></table></div>
    <div class="grid grid-cols-2 gap-5"><div class="card p-4"><div class="font-semibold text-[13px] mb-3">Waiting for your review</div>${all.filter(x => x.rc.lastRun && x.res.rate >= 90).slice(0, 3).map(x => `<button data-act="open-recon" data-id="${x.rc.id}" class="w-full flex items-center gap-3 py-2 text-left border-b last:border-0 border-line-soft"><span class="w-2 h-2 rounded-full bg-ok"></span><span class="flex-1 font-medium">${esc(x.rc.name)}</span><span class="mono text-[12px] text-muted">${x.res.rate}%</span></button>`).join('') || '<div class="text-[12px] text-faint text-center py-4">Nothing run yet</div>'}</div><div class="card p-4"><div class="font-semibold text-[13px] mb-3">Waiting on others</div>${all.filter(x => x.rc.owner !== DB.user.name).slice(0, 3).map(x => `<button data-act="open-recon" data-id="${x.rc.id}" class="w-full flex items-center gap-3 py-2 text-left border-b last:border-0 border-line-soft"><span class="w-2 h-2 rounded-full ${x.res.breaks.length ? 'bg-warn' : 'bg-ok'}"></span><span class="flex-1"><span class="block font-medium">${esc(x.rc.name)}</span><span class="block text-[11px] text-faint">${esc(x.rc.owner)}</span></span><span class="mono text-[12px] text-muted">${x.res.breaks.length} open</span></button>`).join('')}</div></div></div>`;
    }
    function viewReconciliations() {
      const all = DB.recs.map(rc => ({ rc, res: getEngineResult(rc) }));
      return topbar('All reconciliations', `${DB.period.label} · ${all.length} active definitions`, `<button data-act="new-recon" class="btn btn-primary">${icon('plus', 'w-4 h-4')}New reconciliation</button>`) + `<div class="flex-1 overflow-y-auto p-6 fade-in"><div class="flex items-center gap-2 mb-4"><div class="relative flex-1 max-w-sm"><span class="absolute left-3 top-2 text-faint">${icon('search', 'w-4 h-4')}</span><input class="field pl-9" placeholder="Search reconciliations"></div><button class="btn btn-ghost">${icon('filter', 'w-4 h-4')}Filters</button><button class="btn btn-ghost">Saved views</button></div><div class="card overflow-hidden"><table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line"><th class="px-4 py-2">Name</th><th class="px-3 py-2">Type / entity</th><th class="px-3 py-2">Owner · reviewer</th><th class="px-3 py-2">Status</th><th class="px-3 py-2 text-right">Match rate</th><th class="px-3 py-2 text-right">Open exceptions</th><th class="px-3 py-2 text-right">Unreconciled value</th><th class="px-4 py-2 text-right">Due</th></tr></thead><tbody>${all.map(({ rc, res }) => `<tr class="border-b border-line-soft row-hover cursor-pointer" data-act="open-recon" data-id="${rc.id}"><td class="px-4 py-3"><div class="font-semibold">${esc(rc.name)}</div><div class="text-[11px] text-faint">${rc.cadence} · ${rc.lastRun ? 'last run ' + rc.lastRun.at.slice(0, 10) : 'never run'}</div></td><td class="px-3 py-3"><div>${TYPE_META[rc.type].label}</div><div class="text-[11px] text-faint">Meridian India</div></td><td class="px-3 py-3"><div>${esc(rc.owner)}</div><div class="text-[11px] text-faint">Reviewer · Alex Rivera</div></td><td class="px-3 py-3"><span class="chip ${!rc.lastRun ? '' : res.breaks.length ? 'bg-warn-soft text-warn-ink border-warn-soft' : 'bg-ok-soft text-ok-ink border-ok-soft'}">${recStatus(rc, res)}</span></td><td class="px-3 py-3 text-right mono font-semibold ${!rc.lastRun ? 'text-faint' : res.rate >= 95 ? 'text-ok-ink' : 'text-warn-ink'}">${rc.lastRun ? res.rate + '%' : '—'}</td><td class="px-3 py-3 text-right mono ${rc.lastRun ? '' : 'text-faint'}">${rc.lastRun ? res.breaks.length : '—'}</td><td class="px-3 py-3 text-right mono ${rc.lastRun ? '' : 'text-faint'}">${rc.lastRun ? fmtMoney(res.breakVal) : '—'}</td><td class="px-4 py-3 text-right text-muted">Jul ${20 + ((rc.name.length) % 5)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    function viewTransactions() {
      const txnStatus = (rc, r) => { const e = getEngineResult(rc); if (r.resolution) return 'resolved'; if (e.matched.some(m => m.aId === r.id || m.bId === r.id)) return 'matched'; if (e.suggested.some(m => m.aId === r.id || m.bId === r.id)) return 'suggested'; return 'break'; };
      const q = (DB.filters.txnQ || '').toLowerCase(), filter = DB.filters.txnStatus || 'all';
      const rows = DB.recs.flatMap(rc => rc.records.map(r => ({ rc, r, status: txnStatus(rc, r) }))).filter(x => filter === 'all' || x.status === filter).filter(x => !q || [x.r.counterparty, x.r.memo, x.r.reference, fmtMoney(x.r.amount, x.r.currency), x.rc.name].join(' ').toLowerCase().includes(q)).slice(0, 100);
      return topbar('Transactions', 'Forensic search across normalized source records', '') + `<div class="flex-1 overflow-y-auto p-6 fade-in"><div class="flex items-center gap-2 mb-2"><div class="relative flex-1 max-w-md"><span class="absolute left-3 top-2 text-faint">${icon('search', 'w-4 h-4')}</span><input data-txn-search class="field pl-9" value="${esc(DB.filters.txnQ || '')}" placeholder="Search reference, counterparty, amount, or reconciliation"></div><select data-txn-status class="field w-[170px]"><option value="all">All statuses</option><option value="matched" ${filter === 'matched' ? 'selected' : ''}>Matched</option><option value="suggested" ${filter === 'suggested' ? 'selected' : ''}>Suggested</option><option value="break" ${filter === 'break' ? 'selected' : ''}>Exception</option><option value="resolved" ${filter === 'resolved' ? 'selected' : ''}>Resolved</option></select></div><div class="text-[12px] text-muted mb-4">${rows.length} transaction${rows.length === 1 ? '' : 's'} shown · click a row to inspect source, matching, and activity history</div><div class="card overflow-hidden"><table class="w-full text-[13px]"><thead><tr class="lbl text-left border-b border-line"><th class="px-4 py-2">Transaction</th><th class="px-3 py-2">Source</th><th class="px-3 py-2">Reference</th><th class="px-3 py-2">Reconciliation</th><th class="px-3 py-2">Status</th><th class="px-4 py-2 text-right">Amount</th></tr></thead><tbody>${rows.length ? rows.map(({ rc, r, status }) => `<tr data-act="open-transaction" data-rec="${rc.id}" data-record="${r.id}" class="border-b border-line-soft row-hover cursor-pointer"><td class="px-4 py-2.5"><div class="font-medium">${esc(r.counterparty)}</div><div class="text-[11px] text-faint">${esc(r.memo)}</div></td><td class="px-3 py-2.5"><span class="chip">${r.side === 'A' ? TYPE_META[rc.type].aKind : TYPE_META[rc.type].bKind}</span></td><td class="px-3 py-2.5 mono text-[12px] text-muted">${esc(r.reference || '—')}</td><td class="px-3 py-2.5 text-muted">${esc(rc.name)}</td><td class="px-3 py-2.5">${statusPill(status)}</td><td class="px-4 py-2.5 text-right mono font-semibold">${fmtMoney(r.amount, r.currency)}</td></tr>`).join('') : `<tr><td colspan="6" class="px-4 py-12 text-center text-muted">No transactions match the current search and status filter.</td></tr>`}</tbody></table></div></div>`;
    }

    function twistCard(rec, res) {
      if (rec.type === 'ar') {
        const inv = rec.records.filter(r => r.side === 'B'); const T = todayISO();
        const buck = [['Current', 0, 30, 0], ['31–60 days', 31, 60, 0], ['61–90 days', 61, 90, 0], ['90+ days', 91, 99999, 0]];
        inv.forEach(r => { const age = Math.abs(dateDiff(T, r.date)); const b = buck.find(x => age >= x[1] && age <= x[2]); if (b) b[3] += Math.abs(r.amount); });
        return `<div class="col-span-3 card overflow-hidden"><div class="px-4 h-11 flex items-center border-b border-line"><div class="font-semibold text-[13px]">Invoice aging</div><div class="ml-auto text-[11.5px] text-muted">Open receivables by age · disputes routed to Exceptions</div></div>
      <div class="grid grid-cols-4 divide-x divide-line">${buck.map(([l, , , v], i) => `<div class="p-4"><div class="lbl">${l}</div><div class="mono text-[20px] font-semibold mt-1 ${i >= 2 ? 'text-warn-ink' : ''}">${fmtMoney(v)}</div></div>`).join('')}</div></div>`;
      }
      if (rec.type === 'payroll' && rec.tax) {

    // kind's non-bank side — customer-lock/candidate-pool kinds compare against a customer field,
    // allocation kinds compare against a sub-ledger (invoice) field, so the key and label differ.
    function arFieldOptionsFor(kind) {
      if (kind === 'account-suffix') return { bank: AR_ACCOUNT_FIELD_OPTIONS, sourceCategory: 'account-customer-only', defaultSource: 'customer' };
      if (kind === 'exact-invoice-num' || kind === 'invoice-suffix') return { bank: AR_BANK_FIELD_OPTIONS, sourceCategory: 'alloc-text', defaultSource: 'invoice' };
      if (kind === 'exact-amount' || kind === 'tds-match') return { bank: AR_AMOUNT_BANK_FIELD_OPTIONS, sourceCategory: 'alloc-amount', defaultSource: 'invoice' };
      if (['subset-sum', 'bank-fee', 'write-off', 'overpayment'].includes(kind)) return { bank: AR_AMOUNT_PAY_FIELD_OPTIONS, sourceCategory: 'alloc-amount', defaultSource: 'invoice' };
      return { bank: AR_BANK_FIELD_OPTIONS, sourceCategory: 'customer-only', defaultSource: 'customer' };
    }
    // Resolves which source (entity) is actually in effect for a rule's second side, and the field

    // a stale/invalid source got saved (e.g. after switching matchers).
    function arSecondSourceInfo(rl) {
      const { sourceCategory, defaultSource } = arFieldOptionsFor(rl.kind);
      const sources = arSide2Sources()[sourceCategory];
      const sourceKey = (rl.secondSource && sources[rl.secondSource]) ? rl.secondSource : defaultSource;
      return { sourceKey, sources, options: sources[sourceKey].options };
    }
    function arFieldCompareLines(rl) {
      if (rl.kind === 'account-ifsc') {

        const acctCustOpt = arFieldOpt(AR_ACCOUNT_CUST_FIELD_OPTIONS, rl.custAccountField);
        const ifscOpt = arFieldOpt(AR_IFSC_FIELD_OPTIONS, rl.bankIfscField);
        const ifscCustOpt = arFieldOpt(AR_IFSC_CUST_FIELD_OPTIONS, rl.custIfscField);
        return [`${acctOpt.value} ↔ ${acctCustOpt.value}`, `${ifscOpt.value} ↔ ${ifscCustOpt.value}`];
      }
      const { bank } = arFieldOptionsFor(rl.kind);
      const { options } = arSecondSourceInfo(rl);

    function arReconSources(rec) {

                <input id="${inputId}" type="file" data-ardocupload data-doc="${d.key}" accept=".csv,.tsv" class="hidden">

    // Three named matching streams shown as a segmented control within the Matched tab, plus an
    // "All" view that keeps today's single combined list — nothing is removed, just organized.
    const AR_MATCH_STREAMS = [

      ['gl', 'Sub-Ledger vs GL Control'],

    function arMatchSegControl(stream) {
      return `<div class="inline-flex items-center gap-1 p-1 bg-sunken rounded-lg mb-4">${AR_MATCH_STREAMS.map(([k, l]) => `<button data-act="ar-match-stream" data-stream="${k}" class="px-3 py-1.5 rounded-md text-[12.5px] font-semibold transition ${stream === k ? 'bg-surface shadow-sm text-ink' : 'text-muted hover:text-ink'}">${l}</button>`).join('')}</div>`;
    }

    // for customer-lock bypassed by a manual/collision match, "Resolved via candidate pool" for a
    // Phase 1B pool resolved by Phase 2's exact-amount check rather than a Phase 1A lock.
    function arIdentificationMethodFor(res, paymentIdStr) {
      const firstId = String(paymentIdStr || '').split(',')[0].trim();
      const pay = (res.payments || []).find(p => p.paymentId === firstId);
      if (!pay) return 'Manual';
      if (pay.lockedBy) return pay.lockedBy.name;
      return pay.customerId ? 'Resolved via candidate pool' : 'Manual';

    // Surfaces the raw values actually compared for signals that are a direct field-vs-field check —
    // turns an opaque label like "Expected UTR match" into a verifiable audit fact: <bank value> = <customer value>.
    // Returns one line per independent field-pair the matched rule checked.
    function arIdentificationFieldCompareLines(res, pay) {
      if (!pay || !pay.lockedBy || !['expected-utr', 'account-ifsc', 'upi', 'customer-code', 'gstin-pan', 'fuzzy-name'].includes(pay.lockedBy.kind)) return [];
      const bs = (res.bankStatements || []).find(b => b.bankTxnId === pay.bankTxnId);
      const cust = (res.customers || []).find(c => c.customerId === pay.customerId);
      if (!bs || !cust) return [];
      // Read off the rule itself (lockedBy IS the rule that matched) so this reflects whichever
      // fields were actually selected at match time, not a hardcoded pair.
      if (pay.lockedBy.kind === 'account-ifsc') {
        const acctOpt = arFieldOpt(AR_ACCOUNT_FIELD_OPTIONS, pay.lockedBy.bankAccountField);
        const acctCustOpt = arFieldOpt(AR_ACCOUNT_CUST_FIELD_OPTIONS, pay.lockedBy.custAccountField);
        const ifscOpt = arFieldOpt(AR_IFSC_FIELD_OPTIONS, pay.lockedBy.bankIfscField);
        const ifscCustOpt = arFieldOpt(AR_IFSC_CUST_FIELD_OPTIONS, pay.lockedBy.custIfscField);
        return [
          `${acctOpt.value} "${bs[acctOpt.prop]}" = ${acctCustOpt.value} "${cust[acctCustOpt.prop]}"`,
          `${ifscOpt.value} "${bs[ifscOpt.prop]}" = ${ifscCustOpt.value} "${cust[ifscCustOpt.prop]}"`,

      }
      const bankOpt = arFieldOpt(AR_BANK_FIELD_OPTIONS, pay.lockedBy.bankField);
      const custOpt = arFieldOpt(AR_CUST_FIELD_OPTIONS, pay.lockedBy.secondField);
      return [`${bankOpt.value} "${bs[bankOpt.prop]}" = ${custOpt.value} "${cust[custOpt.prop]}"`];
    }
    function arMatchedTable(rec, res, title) {
      return `<div class="card overflow-hidden"><div class="px-4 h-11 flex items-center border-b border-line"><div class="font-semibold text-[13px]">${esc(title)} (${res.matches.length + res.overpays.length})</div></div>

        const ruleName = m.ruleName || 'Manual match';
        const idMethod = arIdentificationMethodFor(res, m.paymentId);
        const firstPayId = String(m.paymentId || '').split(',')[0].trim();
        const pay = (res.payments || []).find(p => p.paymentId === firstPayId);

    function arGatewaySection(rec) {

    function arGlSection(res) {
      if (!res.glControlBalances) return `<div class="card p-8 text-center text-[13px] text-muted">GL control check is disabled in Rules Studio — enable the "AR Sub-ledger ↔ GL control" rule to see this.</div>`;

      return `<div class="card overflow-hidden"><div class="px-4 h-11 flex items-center border-b border-line"><div class="font-semibold text-[13px]">AR Sub-Ledger ↔ GL Account ${esc(g.account)}</div></div>
      <div class="p-5 grid grid-cols-3 gap-4 text-center">
        <div><div class="lbl mb-1">AR sub-ledger</div><div class="text-lg font-semibold mono">${fmtMoney(g.subledgerBalance)}</div></div>
        <div><div class="lbl mb-1">GL account ${esc(g.account)}</div><div class="text-lg font-semibold mono">${fmtMoney(g.glBalance)}</div></div>
        <div><div class="lbl mb-1 ${g.variance ? 'text-bad-ink' : 'text-ok-ink'}">Variance</div><div class="text-lg font-semibold mono ${g.variance ? 'text-bad-ink' : 'text-ok-ink'}">${fmtMoney(g.variance)}</div></div>
      </div>
      ${res.glMismatch ? `<div class="px-5 pb-5 text-[12px] text-bad-ink">${esc(res.glMismatch.account)} mismatch suspected — an unposted adjustment is likely. See Exceptions for the logged entry.</div>` : `<div class="px-5 pb-5 text-[12px] text-ok-ink">In balance — no variance beyond the configured tolerance.</div>`}

    function arReconMatches(rec, res) {
